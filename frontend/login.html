<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sistema Riozen — Entrar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/css/base.css">
<style>
  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .card-login {
    width: 100%;
    max-width: 380px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 40px 36px;
  }
  .marca { margin-bottom: 28px; text-align: center; }
  .marca img { height: 46px; width: auto; display: block; margin: 0 auto 14px; }
  .marca .tag {
    font-family: var(--font-mono);
    font-size: 12px;
    color: var(--text-faint);
    letter-spacing: 0.04em;
  }
  .marca h1 {
    font-size: 21px;
    font-weight: 600;
    margin: 4px 0 0;
    color: var(--text);
  }
  form {
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  .btn-primary {
    width: 100%;
    margin-top: 4px;
    padding: 12px;
  }
  .rodape {
    margin-top: 22px;
    font-size: 12.5px;
    color: var(--text-faint);
    text-align: center;
  }
</style>
</head>
<body>

<div class="card-login">
  <div class="marca">
    <img src="/static/img/riozen_logo.png" alt="Riozen">
    <div class="tag">RIOZEN &middot; TOYOTA / BYD</div>
  </div>

  <form id="form-login" autocomplete="on">
    <div id="erro" class="erro"></div>
    <div class="campo">
      <label for="login">Usuario</label>
      <input type="text" id="login" name="login" autocomplete="username" required autofocus>
    </div>
    <div class="campo">
      <label for="senha">Senha</label>
      <input type="password" id="senha" name="senha" autocomplete="current-password" required>
    </div>
    <button type="submit" class="btn btn-primary" id="btn-entrar">Entrar</button>
  </form>

  <div class="rodape">Acesso restrito &middot; equipe fiscal / contabil</div>
</div>

<script>
const form = document.getElementById("form-login");
const erroBox = document.getElementById("erro");
const btn = document.getElementById("btn-entrar");

function mostrarErro(msg) {
  erroBox.textContent = msg;
  erroBox.classList.add("visivel");
}

form.addEventListener("submit", async (ev) => {
  ev.preventDefault();
  erroBox.classList.remove("visivel");

  const login = document.getElementById("login").value.trim();
  const senha = document.getElementById("senha").value;

  if (!login || !senha) {
    mostrarErro("Preencha usuario e senha.");
    return;
  }

  btn.disabled = true;
  btn.textContent = "Entrando...";

  try {
    const resp = await fetch("/api/login", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ login, senha })
    });

    if (!resp.ok) {
      const dados = await resp.json().catch(() => ({}));
      mostrarErro(dados.detail || "Nao foi possivel entrar. Confira usuario e senha.");
      btn.disabled = false;
      btn.textContent = "Entrar";
      return;
    }

    window.location.href = "/";
  } catch (e) {
    mostrarErro("Nao foi possivel conectar ao servidor. Verifique a rede.");
    btn.disabled = false;
    btn.textContent = "Entrar";
  }
});
</script>

</body>
</html>
