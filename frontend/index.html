<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sistema Riozen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<script>
  // Aplica o tema salvo ANTES do CSS pintar a tela, senão dá um "flash"
  // de escuro por uma fração de segundo mesmo com o claro escolhido.
  try {
    var t = localStorage.getItem("riozen_tema");
    if (t === "claro") document.documentElement.setAttribute("data-tema", "claro");
  } catch (e) {}
</script>
<link rel="stylesheet" href="/static/css/base.css">
<link rel="stylesheet" href="/static/css/assistente.css">
<style>
  body { display: flex; min-height: 100vh; }

  .sidebar {
    width: 232px;
    flex-shrink: 0;
    background: var(--surface);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    height: 100vh;
    position: sticky;
    top: 0;

  }

  .sidebar-logo { line-height: 0; text-align: center; margin-bottom: 4px; }
  .sidebar-logo img { height: 34px; width: auto; display: block; margin: 0 auto; }
  .sidebar-sub { font-size: 12px; color: var(--text-faint); margin-top: 2px; text-align: center; }
  .sidebar-info {
    margin: 14px 0 4px;
    padding-top: 14px;
    border-top: 1px solid var(--border);

    color: var(--text-faint);
    line-height: 1.6;
  }
  .sidebar-info .destaque { color: var(--accent-text); font-weight: 600; display: block; margin-bottom: 2px; }

  .sidebar-rotulo {
    font-family: var(--font-mono);
    font-size: 10.5px;
    color: var(--text-faint);
    letter-spacing: 0.06em;
    padding: 14px 18px 6px;
  }

  .nav-grupo { }
  .nav-grupo-btn {
    display: flex;
    align-items: center;
    justify-content: space-between;
    width: 100%;
    background: none;
    border: none;
    color: var(--text-dim);
    font-family: inherit;
    font-size: 13.5px;
    font-weight: 500;
    text-align: left;
    padding: 9px 18px;
    cursor: pointer;
  }
  .nav-grupo-btn:hover { color: var(--accent-text); }
  .nav-grupo-btn .seta { font-size: 11px; transition: transform 0.1s ease; color: var(--text-faint); }
  .nav-grupo.aberto .nav-grupo-btn .seta { transform: rotate(90deg); }
  .nav-grupo.aberto .nav-grupo-btn { color: var(--accent-text); }

  .nav-sub { display: none; padding-bottom: 4px; }
  .nav-grupo.aberto .nav-sub { display: block; }
  .nav-sub-titulo {
    font-size: 11.5px;
    font-weight: 600;
    color: var(--text-faint);
    padding: 7px 18px 3px 30px;
  }
  .nav-leaf {
    display: block;
    width: 100%;
    background: none;
    border: none;
    color: var(--text-dim);
    font-family: inherit;
    font-size: 13px;
    text-align: left;
    padding: 6px 18px 6px 38px;
    cursor: pointer;
  }
  .nav-leaf:hover { color: var(--accent-text); background: var(--surface-2); }
  .nav-leaf.ativo { color: var(--accent-text); background: var(--surface-2); font-weight: 500; }

  .nav-simples {
    display: block;
    width: 100%;
    background: none;
    border: none;
    color: var(--text-dim);
    font-family: inherit;
    font-size: 13.5px;
    font-weight: 500;
    text-align: left;
    padding: 9px 18px;
    cursor: pointer;
  }
  .nav-simples:hover { color: var(--accent-text); }
  .nav-simples.ativo { color: var(--accent-text); background: var(--surface-2); }

  .sidebar-rodape {
    margin-top: auto;
    padding: 10px;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .rodape-btn {
    background: var(--surface-2);
    border: none;
    color: var(--text-dim);
    font-family: inherit;
    font-size: 12.5px;
    font-weight: 500;
    text-align: left;
    padding: 8px 10px;
    border-radius: var(--radius);
    cursor: pointer;

  .area-principal { flex: 1; min-width: 0; display: flex; flex-direction: column; }

  .grade-setores {

    font-size: 14px;
    padding: 80px 0;
    text-align: center;
  }

  .placeholder p { margin: 0; color: var(--text-dim); font-size: 14px; }

  .icms-wrap { max-width: 720px; display: flex; flex-direction: column; gap: 18px; }
  .icms-linha { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 14px; }
  .icms-select, .icms-input {
    background: var(--surface-2);
    border: 1px solid var(--border-strong);
    border-radius: var(--radius);
    color: var(--text);
    padding: 10px 11px;
    font-family: var(--font-mono);
  }
  .icms-file {
    color: var(--text-dim);
    font-size: 13px;
  }
  .icms-rotulo-log {
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--text-faint);
    letter-spacing: 0.05em;
    margin-top: 4px;
  }
  .icms-log {
    background: #0c0f12;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 14px;
    font-family: var(--font-mono);
    font-size: 12.5px;
    color: #b9c2ca;
    white-space: pre-wrap;
    max-height: 260px;
    overflow-y: auto;
    margin: 0;
  }
  .icms-tabela { width: 100%; border-collapse: collapse; font-size: 14px; }
  .icms-tabela td { padding: 8px 4px; border-bottom: 1px solid var(--border); }
  .icms-tabela td.valor { text-align: right; font-family: var(--font-mono); }
  .icms-tabela tr.destaque td { font-weight: 700; color: var(--accent-text); border-top: 2px solid var(--border-strong); border-bottom: none; }
  .icms-nota { margin-top: 14px; font-size: 13px; color: var(--text-dim); }
  .icms-nota.ok { color: var(--accent-text); }
  .icms-nota ul { margin: 6px 0 0; padding-left: 18px; }

  .icms-secao { margin-top: 28px; padding-top: 22px; border-top: 1px solid var(--border); }
  .icms-secao h3 { font-size: 15px; font-weight: 600; margin: 0 0 4px; }
  .icms-secao .sub { font-size: 12.5px; color: var(--text-faint); margin: 0 0 14px; }
  .icms-badge { font-family: var(--font-mono); font-size: 10.5px; font-weight: 600; padding: 2px 7px; border-radius: 4px; letter-spacing: 0.03em; }
  .icms-badge.ok { color: var(--accent-text); border: 1px solid var(--accent); }
  .icms-badge.divergente { color: var(--warning); border: 1px solid var(--warning); }
  .icms-cmp-tabela { width: 100%; border-collapse: collapse; font-size: 13px; margin-bottom: 18px; }
  .icms-cmp-tabela th { text-align: left; font-size: 11px; color: var(--text-faint); font-weight: 500; padding: 4px; border-bottom: 1px solid var(--border-strong); }
  .icms-cmp-tabela td { padding: 6px 4px; border-bottom: 1px solid var(--border); font-family: var(--font-mono); }
  .icms-cmp-tabela td.num { text-align: right; }
  .icms-cmp-tabela tr.linha-divergente td { color: var(--warning); }
  .icms-anomalias { background: #241a10; border: 1px solid var(--warning); border-radius: var(--radius); padding: 12px 14px; font-size: 13px; color: #e0c19a; }
  .icms-anomalias ul { margin: 8px 0 0; padding-left: 18px; }
  .icms-anomalias li { margin-bottom: 4px; }

  .icms-print-header { display: none; }
  .btn-imprimir {
    display: inline-flex; align-items: center; gap: 6px;
    margin-top: 20px; padding: 9px 16px;
    background: var(--surface-2); border: 1px solid var(--border-strong); border-radius: var(--radius);
    color: var(--text); font-family: inherit; font-size: 13px; cursor: pointer;
  }
  .btn-imprimir:hover { border-color: var(--accent); color: var(--accent-text); }

  @media print {
    body * { visibility: hidden; }
    .sidebar, .topo, .acoes-nav, .icms-linha, #icms-pdf-inputs,
    .btn-primary, .btn-imprimir, .icms-rotulo-log, .icms-log { display: none !important; }
    #icms-resultado, #icms-resultado * { visibility: visible; }
    #icms-resultado { position: absolute; left: 0; top: 0; width: 100%; }
    .icms-print-header {
      display: block; margin-bottom: 18px; padding-bottom: 12px; border-bottom: 2px solid #000;
    }
    .icms-print-header h2 { margin: 0 0 4px; font-size: 18px; }
    .icms-print-header .linha { font-size: 12px; color: #333; }
    .icms-tabela td, .icms-cmp-tabela td, .icms-cmp-tabela th { color: #000 !important; border-color: #999 !important; }
    .icms-tabela tr.destaque td { color: #000 !important; }
    .icms-badge.ok { color: #060 !important; border-color: #060 !important; }
    .icms-badge.divergente { color: #900 !important; border-color: #900 !important; }
    .icms-anomalias { border-color: #900 !important; background: #fff !important; color: #000 !important; }
  }

  .btn-sefaz {
    display: inline-flex; align-items: center; gap: 6px;
    background: none; border: 1px solid var(--border-strong); border-radius: var(--radius);
    color: var(--text-dim); font-family: inherit; font-size: 13px; padding: 9px 14px; cursor: pointer;
  }
  .btn-sefaz:hover:not(:disabled) { border-color: var(--accent); color: var(--accent-text); }
  .btn-sefaz:disabled { opacity: 0.4; cursor: not-allowed; }
  .icms-sefaz-aviso { font-size: 12px; color: var(--text-faint); margin-top: 6px; }
  .icms-sefaz-lista { list-style: none; margin: 8px 0 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
  .icms-sefaz-item { font-size: 13px; padding: 8px 10px; border-radius: var(--radius); border-left: 3px solid var(--warning); background: var(--surface-2); }
  .icms-sefaz-item .tag { font-family: var(--font-mono); font-size: 10px; color: var(--warning); letter-spacing: 0.04em; margin-right: 6px; }
  .icms-sefaz-item.faltando { border-left-color: #e05252; }
  .icms-sefaz-item.faltando .tag { color: #e05252; }
  .icms-sefaz-detalhe { margin-top: 6px; padding-left: 12px; font-family: var(--font-mono); font-size: 11.5px; color: var(--text-faint); }

  .pcofins-downloads { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; }
  .pcofins-download {
    display: inline-block; width: fit-content; padding: 8px 14px;
    border: 1px solid var(--accent); border-radius: var(--radius);
    color: var(--accent-text); text-decoration: none; font-size: 13px; font-weight: 600;
  }
  .pcofins-download:hover { background: var(--surface-2); }

  .tabela-simples { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 13px; }
  .tabela-simples th {
    text-align: left; padding: 8px 10px; color: var(--text-faint);
    font-weight: 600; font-size: 12px; border-bottom: 1px solid var(--border);
  }
  .tabela-simples td { padding: 8px 10px; border-bottom: 1px solid var(--border); }
  .tabela-simples tr:hover td { background: var(--surface-2); }
  .tabela-acoes { display: flex; gap: 6px; white-space: nowrap; }
  .btn-pequeno { padding: 4px 10px; font-size: 12px; }

  /* ── Tela de Configurações ─────────────────────────────────────────────── */
  .cfg-wrap { display: flex; gap: 20px; align-items: flex-start; }
  .cfg-abas {
    width: 180px; flex-shrink: 0; background: var(--surface-2);
    border-radius: var(--radius); overflow: hidden;
  }
  .cfg-aba-btn {
    display: block; width: 100%; text-align: left; background: transparent;
    border: none; color: var(--text-dim); font-family: inherit; font-size: 13px;
    padding: 12px 16px; cursor: pointer; border-bottom: 1px solid var(--border);
  }
  .cfg-aba-btn:last-child { border-bottom: none; }
  .cfg-aba-btn:hover { background: var(--surface); color: var(--text); }
  .cfg-aba-btn.ativa { background: var(--accent); color: #06231c; font-weight: 600; }
  .cfg-conteudo { flex: 1; min-width: 0; }

  .cfg-tema-cards { display: flex; gap: 16px; }
  .cfg-tema-card {
    width: 180px; border: 2px solid var(--border); border-radius: var(--radius);
    padding: 14px; cursor: pointer; background: var(--surface-2);
  }
  .cfg-tema-card.ativo { border-color: var(--accent); }
  .cfg-tema-preview { height: 76px; border-radius: 6px; margin-bottom: 10px; display: flex; overflow: hidden; }
  .cfg-tema-preview .lado { width: 30%; }
  .cfg-tema-preview .corpo { flex: 1; padding: 8px; }
  .cfg-tema-preview .linha { height: 8px; border-radius: 3px; margin-bottom: 6px; }

  .cfg-usuario-card, .cfg-modelo-item, .cfg-empresa-item {
    background: var(--surface-2); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 10px 12px; margin-bottom: 8px;
  }
  .cfg-usuario-linha1 { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 13px; }
  .cfg-usuario-linha2 { display: flex; gap: 8px; margin-top: 8px; }
  .cfg-badge { font-size: 11px; padding: 2px 8px; border-radius: 10px; background: var(--surface); }
  .cfg-badge.ok { color: #2da478; }
  .cfg-badge.off { color: var(--text-faint); }

  .cfg-empresas-layout { display: flex; gap: 16px; align-items: flex-start; }

  .cfg-empresa-item { cursor: pointer; padding: 8px 10px; font-size: 13px; }
  .cfg-empresa-item.ativa { border-color: var(--accent); background: var(--surface); }
  .cfg-empresa-grupo-rotulo { font-size: 11px; color: var(--text-faint); font-weight: 600; margin: 10px 0 4px; }
  .cfg-obrigacao-linha { display: flex; align-items: center; gap: 8px; padding: 4px 0; font-size: 13px; }
  .cfg-obrigacao-linha input[type="text"] { width: 40px; text-align: center; }
  .cfg-setor-bloco { margin-bottom: 14px; }
  .cfg-setor-titulo { font-size: 12px; font-weight: 600; color: var(--accent-text); margin-bottom: 4px; }

  .cfg-log-linha { font-family: var(--font-mono); font-size: 12px; padding: 3px 0; border-bottom: 1px solid var(--border); }
  .cfg-log-tipo { display: inline-block; width: 64px; font-weight: 600; }
  .cfg-log-tipo.ACAO { color: #4ea8de; }
  .cfg-log-tipo.ERRO { color: #e05252; }
  .cfg-log-tipo.SCRIPT { color: #d9b34a; }

  .erro { display: none; }
  .erro.visivel {

</head>
<body>

<div class="sidebar" id="sidebar"></div>

<div class="area-principal">
  <div class="topo">
    <div class="topo-esq">
      <div class="marca-topo">RIOZEN</div>
      <div id="breadcrumb"></div>
    </div>
    <div class="topo-dir">
      <span class="badge-perfil" id="badge-perfil">...</span>
      <div class="usuario-chip">
        <span class="nome" id="usuario-nome">...</span>
      </div>
      <button class="btn btn-sair" id="btn-sair">Sair</button>
    </div>
  </div>

  <main>
    <div id="tela-carregando">Carregando...</div>
    <div id="conteudo" style="display:none"></div>
  </main>
</div>

<script>
let USUARIO = null;
let ROTA_ATIVA = null; // id da folha ativa, pra marcar destaque na sidebar

const SETOR_ICONE = { fiscal: "F", contabil: "C", geral: "G" };

// ---------------------------------------------------------------------
// Arvore de navegacao completa (espelha painel.py). Cada folha (leaf)
// tem um id unico, um rotulo, e o caminho do breadcrumb. disponivel=false
// -> abre a tela padrao "Em desenvolvimento" em vez de um modulo de verdade.
// ---------------------------------------------------------------------
const ARVORE_NAV = [
  {
    grupo: "fiscal", rotulo: "FISCAL", requer: "fiscal", expandirSubgrupos: true,
    subgrupos: [
      { titulo: "Apuracao", rotuloTag: "📊", desc: "Apuracao de impostos por periodo.", itens: [
        { id: "pis_cofins", rotulo: "PIS/COFINS", caminho: ["Fiscal", "Apuracao", "PIS/COFINS"], render: telaPisCofins },
        { id: "cbs_ibs",     rotulo: "CBS/IBS",    caminho: ["Fiscal", "Apuracao", "CBS/IBS"], render: telaCbsIbs },
        { id: "iss",        rotulo: "ISS",        caminho: ["Fiscal", "Apuracao", "ISS"] },
        { id: "icms",       rotulo: "ICMS",       caminho: ["Fiscal", "Apuracao", "ICMS"], render: telaICMS },

function podeVerGrupo(requer) {

function el(tag, props = {}, children = []) {
  const e = document.createElement(tag);
  Object.entries(props).forEach(([k, v]) => {
    if (k === "class") e.className = v;
    else if (k === "onClick") e.addEventListener("click", v);
    else e.setAttribute(k, v);
  });
  children.forEach(c => e.appendChild(typeof c === "string" ? document.createTextNode(c) : c));
  return e;
}

async function reiniciarServico() {
  if (!confirm("Reiniciar o servi\u00e7o RiozenFiscal agora? O sistema fica indispon\u00edvel por alguns segundos pra todo mundo.")) return;
  try {
    const resp = await fetch("/api/admin/reiniciar-servico", { method: "POST" });
    const dados = await resp.json();
    if (!resp.ok) {
      alert(dados.detail || "Falha ao reiniciar.");
      return;
    }
    alert(dados.mensagem || "Reiniciando...");
    setTimeout(() => window.location.reload(), 8000);
  } catch (e) {
    alert("N\u00e3o foi poss\u00edvel falar com o servidor pra pedir o restart.");
  }
}

const MAPA_CERTIFICADO_ICMS = {

  "110|01": "Toyota|PILARES",

};

function chaveCertificadoIcms(grupo, filial) {
  return MAPA_CERTIFICADO_ICMS[`${grupo}|${filial}`] || null;
}

// Converte "MM/AAAA" em {inicio, fim} no formato dd/mm/aaaa que o backend espera
function periodoParaIntervalo(periodoStr) {
  const m = /^(\d{2})\/(\d{4})$/.exec((periodoStr || "").trim());
  if (!m) return null;
  const mes = parseInt(m[1], 10);
  const ano = parseInt(m[2], 10);
  if (mes < 1 || mes > 12) return null;
  const ultimoDia = new Date(ano, mes, 0).getDate(); // dia 0 do mes seguinte = ultimo dia deste mes
  const pad = n => String(n).padStart(2, "0");
  return {
    inicio: `01/${pad(mes)}/${ano}`,
    fim: `${pad(ultimoDia)}/${pad(mes)}/${ano}`,
  };
}

function fmtMoeda(v) {
  return "R$ " + (v || 0).toLocaleString("pt-BR", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}

  secao.appendChild(tabela);

function telaICMS(voltarFn) {
  const conteudo = document.getElementById("conteudo");
  conteudo.innerHTML = "";
  renderAcoesNav(voltarFn);
  conteudo.appendChild(el("div", { class: "titulo-tela" }, [
    el("h2", {}, ["ICMS \u2014 Apura\u00e7\u00e3o"]),
    el("p", {}, ["Selecione empresa, filial e per\u00edodo, e envie os tr\u00eas livros (Fiscal, Entrada e Sa\u00edda) em PDF do NBS."]),
  ]));

  const wrap = el("div", { class: "icms-wrap" });

  // Selects
  const selEmpresa = el("select", { class: "icms-select" });
  EMPRESAS_ICMS.forEach(e => selEmpresa.appendChild(el("option", { value: e.grupo }, [`${e.grupo} - ${e.nome}`])));

  const selFilial = el("select", { class: "icms-select" });
  function atualizarFiliais() {
    selFilial.innerHTML = "";
    const emp = EMPRESAS_ICMS.find(e => e.grupo === selEmpresa.value);
    (emp ? emp.filiais : []).forEach(f => selFilial.appendChild(el("option", { value: f }, [f])));
  }
  selEmpresa.addEventListener("change", atualizarFiliais);
  atualizarFiliais();

  const inputPeriodo = el("input", { type: "text", class: "icms-input", placeholder: "MM/AAAA", maxlength: "7" });
  const hoje = new Date();
  inputPeriodo.value = String(hoje.getMonth() + 1).padStart(2, "0") + "/" + hoje.getFullYear();

  const inputPdfFiscal = el("input", { type: "file", accept: "application/pdf", class: "icms-file" });
  const inputPdfEntrada = el("input", { type: "file", accept: "application/pdf", class: "icms-file" });
  const inputPdfSaida = el("input", { type: "file", accept: "application/pdf", class: "icms-file" });

  const linhaCampos = el("div", { class: "icms-linha" }, [
    el("div", { class: "campo" }, [el("label", {}, ["Empresa"]), selEmpresa]),
    el("div", { class: "campo" }, [el("label", {}, ["Filial"]), selFilial]),
    el("div", { class: "campo" }, [el("label", {}, ["Per\u00edodo"]), inputPeriodo]),
  ]);

  const linhaPdfs = el("div", { class: "icms-linha", id: "icms-pdf-inputs" }, [
    el("div", { class: "campo" }, [el("label", {}, ["Livro Fiscal (apura\u00e7\u00e3o)"]), inputPdfFiscal]),
    el("div", { class: "campo" }, [el("label", {}, ["Livro de Entrada"]), inputPdfEntrada]),
    el("div", { class: "campo" }, [el("label", {}, ["Livro de Sa\u00edda"]), inputPdfSaida]),
  ]);

  const btnApurar = el("button", { class: "btn btn-primary" }, ["Apurar"]);
  const areaLog = el("pre", { class: "icms-log", id: "icms-log" }, []);
  const areaResultado = el("div", { id: "icms-resultado" });

  // ---- Conferencia com a SEFAZ (opcional, separada da apuracao PDF x PDF) ----
  const btnSefaz = el("button", { class: "btn-sefaz" }, ["\ud83d\udd0e Conferir com a SEFAZ"]);
  const avisoSefaz = el("div", { class: "icms-sefaz-aviso" }, []);
  const areaLogSefaz = el("pre", { class: "icms-log", style: "display:none;" }, []);
  const areaResultadoSefaz = el("div", { id: "icms-resultado-sefaz" });

  function atualizarEstadoBotaoSefaz() {
    const chave = chaveCertificadoIcms(selEmpresa.value, selFilial.value);
    const temArquivos = !!(inputPdfEntrada.files[0] && inputPdfSaida.files[0]);
    if (!chave) {
      btnSefaz.disabled = true;
      avisoSefaz.textContent = "Certificado n\u00e3o configurado pra esta filial \u2014 confer\u00eancia com a SEFAZ indispon\u00edvel aqui.";
    } else if (!temArquivos) {
      btnSefaz.disabled = true;
      avisoSefaz.textContent = `Certificado dispon\u00edvel (${chave}). Selecione os PDFs de Entrada e Sa\u00edda acima pra habilitar.`;
    } else {
      btnSefaz.disabled = false;
      avisoSefaz.textContent = `Vai consultar com o certificado: ${chave}`;
    }
  }
  selEmpresa.addEventListener("change", atualizarEstadoBotaoSefaz);
  selFilial.addEventListener("change", atualizarEstadoBotaoSefaz);
  inputPdfEntrada.addEventListener("change", atualizarEstadoBotaoSefaz);
  inputPdfSaida.addEventListener("change", atualizarEstadoBotaoSefaz);

  btnSefaz.addEventListener("click", async () => {
    const intervalo = periodoParaIntervalo(inputPeriodo.value);
    if (!intervalo) {
      areaLogSefaz.style.display = "block";
      areaLogSefaz.textContent = "Per\u00edodo inv\u00e1lido \u2014 use o formato MM/AAAA.";
      return;
    }
    const chave = chaveCertificadoIcms(selEmpresa.value, selFilial.value);
    const [empresaCert, filialCert] = chave.split("|");

    btnSefaz.disabled = true;
    btnSefaz.textContent = "Consultando SEFAZ...";
    areaLogSefaz.style.display = "block";
    areaLogSefaz.textContent = "Consultando resumo de notas na SEFAZ (pode levar alguns minutos)...";
    areaResultadoSefaz.innerHTML = "";

    const dadosForm = new FormData();
    dadosForm.append("entrada", inputPdfEntrada.files[0]);
    dadosForm.append("saida", inputPdfSaida.files[0]);
    dadosForm.append("empresa", empresaCert);
    dadosForm.append("filial", filialCert);
    dadosForm.append("data_inicio", intervalo.inicio);
    dadosForm.append("data_fim", intervalo.fim);
    dadosForm.append("ambiente", "producao");
    dadosForm.append("buscar_detalhe", "true");

    try {
      const resp = await fetch("/api/icms/conferir-sefaz", { method: "POST", body: dadosForm });
      const dados = await resp.json();
      areaLogSefaz.textContent = (dados.logs || []).join("\n") || "(sem log)";

      if (!dados.ok) {
        areaResultadoSefaz.appendChild(el("div", { class: "erro visivel" }, [dados.erro || "Erro ao consultar a SEFAZ."]));
        return;
      }

      areaResultadoSefaz.appendChild(el("p", { class: "sub", style: "font-size:12.5px;color:var(--text-faint);margin:10px 0;" }, [
        `${dados.total_resumos_sefaz} nota(s) no resumo da SEFAZ no per\u00edodo. `,
        `${dados.divergencias_entrada.length + dados.divergencias_saida.length} diverg\u00eancia(s) encontrada(s).`,
      ]));

      const todasDivergencias = [
        ...dados.divergencias_entrada.map(d => ({ ...d, direcao: "Entrada" })),
        ...dados.divergencias_saida.map(d => ({ ...d, direcao: "Sa\u00edda" })),
      ];

      if (!todasDivergencias.length) {
        areaResultadoSefaz.appendChild(el("div", { class: "icms-nota ok" }, ["\u2705 Nenhuma nota faltando ou com valor divergente contra a SEFAZ."]));
      } else {
        const lista = el("ul", { class: "icms-sefaz-lista" });
        todasDivergencias.forEach(d => {
          const faltando = d.tipo === "FALTANDO_NO_PDF";
          const item = el("li", { class: "icms-sefaz-item" + (faltando ? " faltando" : "") }, [
            el("span", { class: "tag" }, [faltando ? "FALTANDO NO PDF" : "VALOR DIVERGENTE"]),
            el("span", {}, [`[${d.direcao}] ${d.descricao}`]),
          ]);
          const detalhe = d.chave && dados.detalhes_divergentes && dados.detalhes_divergentes[d.chave];
          if (detalhe && detalhe.ok && detalhe.itens && detalhe.itens.length) {
            const bloco = el("div", { class: "icms-sefaz-detalhe" }, ["XML completo (CFOP / base / ICMS):"]);
            detalhe.itens.forEach(it => bloco.appendChild(el("div", {}, [
              `  CFOP ${it.cfop} \u2014 base ${fmtMoeda(it.base)} \u2014 ICMS ${fmtMoeda(it.icms)}`,
            ])));
            item.appendChild(bloco);
          } else if (detalhe && !detalhe.ok) {
            item.appendChild(el("div", { class: "icms-sefaz-detalhe" }, [`(n\u00e3o foi poss\u00edvel buscar o XML completo: ${detalhe.erro})`]));
          }
          lista.appendChild(item);
        });
        areaResultadoSefaz.appendChild(lista);
      }

      if (dados.notas_pdf_nao_confirmadas_sefaz && dados.notas_pdf_nao_confirmadas_sefaz.length) {
        areaResultadoSefaz.appendChild(el("p", { class: "icms-sefaz-aviso" }, [
          `\u2139\ufe0f ${dados.notas_pdf_nao_confirmadas_sefaz.length} nota(s) do PDF n\u00e3o apareceram no resumo da SEFAZ pra este per\u00edodo `,
          "(pode ser janela de NSU ainda n\u00e3o coberta \u2014 n\u00e3o necessariamente um problema).",
        ]));
      }
    } catch (e) {
      areaLogSefaz.textContent = "Falha de conex\u00e3o com o servidor.";
    } finally {
      btnSefaz.disabled = false;
      btnSefaz.textContent = "\ud83d\udd0e Conferir com a SEFAZ";
      atualizarEstadoBotaoSefaz();
    }
  });

  atualizarEstadoBotaoSefaz();


  btnApurar.addEventListener("click", async () => {
    if (!inputPdfFiscal.files[0] || !inputPdfEntrada.files[0] || !inputPdfSaida.files[0]) {
      areaLog.textContent = "Selecione os tr\u00eas PDFs (Fiscal, Entrada e Sa\u00edda) antes de apurar.";

    btnApurar.disabled = true;
    btnApurar.textContent = "Apurando...";
    areaLog.textContent = "Enviando e processando...";
    areaResultado.innerHTML = "";

    const dadosForm = new FormData();
    dadosForm.append("fiscal", inputPdfFiscal.files[0]);
    dadosForm.append("entrada", inputPdfEntrada.files[0]);
    dadosForm.append("saida", inputPdfSaida.files[0]);
    dadosForm.append("grupo", selEmpresa.value);
    dadosForm.append("filial", selFilial.value);
    dadosForm.append("periodo", inputPeriodo.value);

    try {
      const resp = await fetch("/api/icms/apurar-completo", { method: "POST", body: dadosForm });
      const dados = await resp.json();

      areaLog.textContent = (dados.logs || []).join("\n") || "(sem log)";

      if (!dados.ok) {
        areaResultado.appendChild(el("div", { class: "erro visivel" }, [dados.erro || "Erro ao apurar."]));
        return;
      }

      const r = dados.resultado;

      // Cabecalho que so aparece na impressao/PDF (visibilidade controlada
      // pelo @media print) -- a tela normal nao mostra isso, so o papel/PDF.
      const agora = new Date();
      const carimbo = agora.toLocaleDateString("pt-BR") + " " + agora.toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" });
      areaResultado.appendChild(el("div", { class: "icms-print-header" }, [
        el("h2", {}, ["ICMS \u2014 Apura\u00e7\u00e3o \u2014 " + (r.empresa || "-")]),
        el("div", { class: "linha" }, [`CNPJ: ${r.cnpj || "-"}  \u00b7  Insc. Estadual: ${r.insc_est || "-"}`]),
        el("div", { class: "linha" }, [`Per\u00edodo: ${r.periodo || "-"}  \u00b7  Gerado em: ${carimbo}`]),
      ]));

      const linhas = [
        ["Empresa", r.empresa || "-"],
        ["CNPJ", r.cnpj || "-"],
        ["Insc. Estadual", r.insc_est || "-"],
        ["Per\u00edodo (do PDF)", r.periodo || "-"],
        ["Base FECP (imp. debitado)", fmtMoeda(r.fecp_base)],
        ["FECP (2%)", fmtMoeda(r.fecp)],
        ["ICMS campo 013 (NBS)", fmtMoeda(r.icms_013)],
        ["(+) Cr\u00e9ditos j\u00e1 aplicados", fmtMoeda(r.total_applied)],
        ["(-) Cr\u00e9ditos ajustados", fmtMoeda(r.total_not_yet)],
      ];

      const tabela = el("table", { class: "icms-tabela" });
      linhas.forEach(([rotulo, valor]) => {
        tabela.appendChild(el("tr", {}, [el("td", {}, [rotulo]), el("td", { class: "valor" }, [valor])]));
      });
      tabela.appendChild(el("tr", { class: "destaque" }, [el("td", {}, ["ICMS A PAGAR"]), el("td", { class: "valor" }, [fmtMoeda(r.icms_a_pagar)])]));
      tabela.appendChild(el("tr", { class: "destaque" }, [el("td", {}, ["FECP A PAGAR"]), el("td", { class: "valor" }, [fmtMoeda(r.fecp_a_pagar)])]));

      areaResultado.appendChild(tabela);

      if (r.tudo_correto_nbs) {
        areaResultado.appendChild(el("div", { class: "icms-nota ok" }, ["\u2705 NBS j\u00e1 calculou corretamente \u2014 sem ajustes necess\u00e1rios."]));
      } else if (r.observacoes && r.observacoes.length) {
        const notas = el("div", { class: "icms-nota" }, ["Ajustes aplicados:"]);
        const lista = el("ul", {});
        r.observacoes.forEach(o => lista.appendChild(el("li", {}, [o])));
        notas.appendChild(lista);
        areaResultado.appendChild(notas);
      }

      // ---- Livro pr\u00f3prio (nota a nota) \u00d7 Livro Fiscal do NBS ----
      const lp = dados.livro_proprio;
      if (lp) {
        const secao = el("div", { class: "icms-secao" }, [
          el("h3", {}, ["Livro pr\u00f3prio \u00d7 Livro Fiscal (NBS)"]),
          el("p", { class: "sub" }, [
            `${lp.qtd_notas_entrada} nota(s) de entrada e ${lp.qtd_notas_saida} de sa\u00edda lidas nota a nota do PDF. `,
            lp.divergente
              ? "H\u00e1 diverg\u00eancia entre o livro pr\u00f3prio e o oficial \u2014 ver abaixo."
              : "Bateu 100% com o Livro Fiscal, c\u00f3digo por c\u00f3digo.",
          ]),
        ]);
        secao.appendChild(renderTabelaComparacao("Entrada (cr\u00e9dito) por CFOP", lp.comparacao_entrada));
        secao.appendChild(renderTabelaComparacao("Sa\u00edda (d\u00e9bito) por CFOP", lp.comparacao_saida));

        if (lp.anomalias && lp.anomalias.length) {
          const box = el("div", { class: "icms-anomalias" }, [
            el("strong", {}, [`\u26a0\ufe0f ${lp.anomalias.length} anomalia(s) encontrada(s) nas notas:`]),
          ]);
          const listaAnom = el("ul", {});
          lp.anomalias.forEach(a => listaAnom.appendChild(el("li", {}, [a])));
          box.appendChild(listaAnom);
          secao.appendChild(box);
        }

        areaResultado.appendChild(secao);
      }

      const btnImprimir = el("button", { class: "btn-imprimir" }, ["\ud83d\uddb6\ufe0f Imprimir / Salvar PDF"]);
      btnImprimir.addEventListener("click", () => window.print());
      areaResultado.appendChild(btnImprimir);
    } catch (e) {
      areaLog.textContent = "Falha de conex\u00e3o com o servidor.";
    } finally {
      btnApurar.disabled = false;
      btnApurar.textContent = "Apurar";
    }
  });

  wrap.appendChild(linhaCampos);
  wrap.appendChild(linhaPdfs);
  wrap.appendChild(btnApurar);
  wrap.appendChild(el("div", { class: "icms-rotulo-log" }, ["Log"]));
  wrap.appendChild(areaLog);
  wrap.appendChild(areaResultado);

  wrap.appendChild(el("div", { class: "icms-secao" }, [
    el("h3", {}, ["Confer\u00eancia com a SEFAZ (opcional)"]),
    el("p", { class: "sub" }, ["Cruza as notas de Entrada/Sa\u00edda (PDF) contra o resumo que a SEFAZ tem registrado pro CNPJ da filial no per\u00edodo."]),
    btnSefaz,
    avisoSefaz,
    areaLogSefaz,
    areaResultadoSefaz,
  ]));

  conteudo.appendChild(wrap);
}

// ---------------------------------------------------------------------
// PIS/COFINS — Apuracao (3 etapas encadeadas: Debitos -> Creditos -> Apuracao)
// ---------------------------------------------------------------------
const EMPRESAS_PIS_COFINS = ["BYD", "TOYOTA"];

function lerLogHeader(resp) {
  const b64 = resp.headers.get("X-Log-B64");
  if (!b64) return [];
  try {
    return JSON.parse(decodeURIComponent(escape(atob(b64))));
  } catch (e) {
    return [];
  }
}

function baixarBlob(blob, nomeArquivo) {
  const url = URL.createObjectURL(blob);
  const a = el("a", { href: url, download: nomeArquivo, class: "pcofins-download" }, [
    `\u2b07\ufe0f ${nomeArquivo}`,
  ]);
  return a;
}

function telaPisCofins(voltarFn) {
  const conteudo = document.getElementById("conteudo");
  conteudo.innerHTML = "";
  renderAcoesNav(voltarFn);
  conteudo.appendChild(el("div", { class: "titulo-tela" }, [
    el("h2", {}, ["PIS/COFINS \u2014 Apura\u00e7\u00e3o"]),
    el("p", {}, ["Selecione a empresa e o per\u00edodo, envie os arquivos do m\u00eas e gere D\u00e9bitos, Cr\u00e9ditos e Apura\u00e7\u00e3o em sequ\u00eancia."]),
  ]));

  const wrap = el("div", { class: "icms-wrap" });

  const selEmpresa = el("select", { class: "icms-select" });
  EMPRESAS_PIS_COFINS.forEach(emp => selEmpresa.appendChild(el("option", { value: emp }, [emp])));

  const inputPeriodo = el("input", { type: "text", class: "icms-input", placeholder: "MM/AAAA", maxlength: "7" });
  const hoje = new Date();
  inputPeriodo.value = String(hoje.getMonth() + 1).padStart(2, "0") + "/" + hoje.getFullYear();

  const linhaCampos = el("div", { class: "icms-linha" }, [
    el("div", { class: "campo" }, [el("label", {}, ["Empresa"]), selEmpresa]),
    el("div", { class: "campo" }, [el("label", {}, ["Per\u00edodo"]), inputPeriodo]),
  ]);

  // planilhas de d\u00e9bito e de cr\u00e9dito aceitam mais de um arquivo (uma
  // filial por arquivo, ou j\u00e1 consolidado — depende do que o NBS gerou)
  const inputDebitos = el("input", { type: "file", accept: ".xls,.xlsx", multiple: "multiple", class: "icms-file" });
  const inputCreditos = el("input", { type: "file", accept: ".xls,.xlsx", multiple: "multiple", class: "icms-file" });
  const inputBalancete = el("input", { type: "file", accept: ".xls,.xlsx", class: "icms-file" });
  const inputArquivo170 = el("input", { type: "file", accept: ".xls,.xlsx", class: "icms-file" });

  const linhaArquivos1 = el("div", { class: "icms-linha" }, [
    el("div", { class: "campo" }, [el("label", {}, ["Planilha de D\u00e9bitos (Lista Pis Cofins)"]), inputDebitos]),
    el("div", { class: "campo" }, [el("label", {}, ["NBS (Planilha de Cr\u00e9ditos)"]), inputCreditos]),
  ]);
  const linhaArquivos2 = el("div", { class: "icms-linha" }, [
    el("div", { class: "campo" }, [el("label", {}, ["Balancete"]), inputBalancete]),
    el("div", { class: "campo" }, [el("label", {}, ["Arquivo 170 (Servi\u00e7os) \u2014 opcional"]), inputArquivo170]),
  ]);

  const btnApurar = el("button", { class: "btn btn-primary" }, ["Apurar"]);
  const areaLog = el("pre", { class: "icms-log", id: "pcofins-log" }, []);
  const areaResultado = el("div", { id: "pcofins-resultado" });

  function logAppend(linhas, titulo) {
    const atual = areaLog.textContent;
    const bloco = (titulo ? `\u2014\u2014 ${titulo} \u2014\u2014\n` : "") + (linhas.join("\n") || "(sem log)");
    areaLog.textContent = atual ? atual + "\n\n" + bloco : bloco;
    areaLog.scrollTop = areaLog.scrollHeight;
  }

  async function postEtapa(caminho, formData) {
    const resp = await fetch(caminho, { method: "POST", body: formData });
    const logs = lerLogHeader(resp);
    if (!resp.ok) {
      const textoCru = await resp.text();
      let dados = {};
      try { dados = JSON.parse(textoCru); } catch (e) {}
      const erroLogs = dados.logs || [];
      const msg = dados.erro || dados.detail || `HTTP ${resp.status} em ${caminho}`;
      const erro = new Error(msg);
      erro.logs = erroLogs;
      erro.traceback = dados.traceback;
      erro.bruto = (!dados.erro && !dados.detail) ? textoCru.slice(0, 2000) : null;
      throw erro;
    }
    const blob = await resp.blob();
    const nomeArquivo = (resp.headers.get("Content-Disposition") || "").match(/filename="?([^"]+)"?/);
    return { blob, logs, nome: nomeArquivo ? nomeArquivo[1] : "arquivo.xlsx", headers: resp.headers };
  }

  btnApurar.addEventListener("click", async () => {
    if (!inputDebitos.files.length || !inputCreditos.files.length || !inputBalancete.files[0]) {
      areaLog.textContent = "Selecione ao menos: Planilha de D\u00e9bitos, NBS (Cr\u00e9ditos) e Balancete.";
      return;
    }
    btnApurar.disabled = true;
    btnApurar.textContent = "Apurando...";
    areaLog.textContent = "";
    areaResultado.innerHTML = "";

    const empresa = selEmpresa.value;
    const periodo = inputPeriodo.value;

    try {
      // ---- 1. D\u00e9bitos ----
      logAppend(["Enviando planilhas de d\u00e9bito..."], "D\u00e9bitos");
      const fdDeb = new FormData();
      fdDeb.append("empresa", empresa);
      fdDeb.append("periodo", periodo);
      Array.from(inputDebitos.files).forEach(f => fdDeb.append("planilhas_debito", f));
      fdDeb.append("balancete", inputBalancete.files[0]);
      if (inputArquivo170.files[0]) fdDeb.append("arquivo_170", inputArquivo170.files[0]);

      const resDeb = await postEtapa("/api/pis-cofins/debitos", fdDeb);
      logAppend(resDeb.logs, "D\u00e9bitos");
      const pctProporcional = resDeb.headers.get("X-Pct-Proporcional");

      // ---- 2. Cr\u00e9ditos ----
      logAppend(["Enviando planilhas de cr\u00e9dito..."], "Cr\u00e9ditos");
      const fdCred = new FormData();
      fdCred.append("empresa", empresa);
      fdCred.append("periodo", periodo);
      fdCred.append("pct_proporcional", pctProporcional);
      Array.from(inputCreditos.files).forEach(f => fdCred.append("planilhas_credito", f));
      fdCred.append("balancete", inputBalancete.files[0]);

      const resCred = await postEtapa("/api/pis-cofins/creditos", fdCred);
      logAppend(resCred.logs, "Cr\u00e9ditos");

      // ---- 3. Apura\u00e7\u00e3o ----
      logAppend(["Gerando apura\u00e7\u00e3o final..."], "Apura\u00e7\u00e3o");
      const fdApu = new FormData();
      fdApu.append("empresa", empresa);
      fdApu.append("periodo", periodo);
      fdApu.append("arquivo_debitos", resDeb.blob, resDeb.nome);
      fdApu.append("arquivo_creditos", resCred.blob, resCred.nome);

      const resApu = await postEtapa("/api/pis-cofins/apuracao", fdApu);
      logAppend(resApu.logs, "Apura\u00e7\u00e3o");

      areaResultado.appendChild(el("div", { class: "icms-nota ok" }, ["\u2705 Apura\u00e7\u00e3o conclu\u00edda. Baixe os 3 arquivos abaixo:"]));
      const listaDownloads = el("div", { class: "pcofins-downloads" }, [
        baixarBlob(resDeb.blob, resDeb.nome),
        baixarBlob(resCred.blob, resCred.nome),
        baixarBlob(resApu.blob, resApu.nome),
      ]);
      areaResultado.appendChild(listaDownloads);
    } catch (e) {
      if (e.logs && e.logs.length) logAppend(e.logs, "Erro");
      areaResultado.appendChild(el("div", { class: "erro visivel" }, [e.message || "Falha ao apurar."]));
      if (e.traceback) {
        areaResultado.appendChild(el("pre", { class: "icms-log" }, [e.traceback]));
      }
      if (e.bruto) {
        areaResultado.appendChild(el("p", { class: "sub", style: "font-size:12px;color:var(--text-faint);margin-top:8px;" }, ["Resposta crua do servidor (pra diagn\u00f3stico):"]));
        areaResultado.appendChild(el("pre", { class: "icms-log" }, [e.bruto]));
      }
    } finally {
      btnApurar.disabled = false;
      btnApurar.textContent = "Apurar";
    }
  });

  wrap.appendChild(linhaCampos);
  wrap.appendChild(linhaArquivos1);
  wrap.appendChild(linhaArquivos2);
  wrap.appendChild(btnApurar);
  wrap.appendChild(el("div", { class: "icms-rotulo-log" }, ["Log"]));
  wrap.appendChild(areaLog);
  wrap.appendChild(areaResultado);

  conteudo.appendChild(wrap);
}

// ---------------------------------------------------------------------
// Cadastro de Clientes/Fornecedores — regime tributário por CNPJ
// (usado, entre outras coisas, pelo futuro Simulador IBS/CBS)
// ---------------------------------------------------------------------
const REGIMES_CADASTRO = [
  { valor: "regime_geral", rotulo: "Regime Geral" },
  { valor: "simples_das", rotulo: "Simples Nacional (DAS)" },
  { valor: "simples_fora_das", rotulo: "Simples Nacional fora da DAS" },
];

function rotuloRegime(valor) {
  const r = REGIMES_CADASTRO.find(r => r.valor === valor);
  return r ? r.rotulo : valor;
}

function formatarCnpjExibicao(cnpj) {
  const d = (cnpj || "").replace(/\D/g, "");
  if (d.length !== 14) return cnpj || "";
  return `${d.slice(0,2)}.${d.slice(2,5)}.${d.slice(5,8)}/${d.slice(8,12)}-${d.slice(12,14)}`;
}

function telaCadastroRegime(voltarFn) {
  const conteudo = document.getElementById("conteudo");
  conteudo.innerHTML = "";
  renderAcoesNav(voltarFn);
  conteudo.appendChild(el("div", { class: "titulo-tela" }, [
    el("h2", {}, ["Clientes e Fornecedores \u2014 Regime Tribut\u00e1rio"]),
    el("p", {}, ["Cadastro por CNPJ, compartilhado entre Clientes e Fornecedores (a mesma empresa pode ser as duas coisas). Usado pelo Simulador IBS/CBS pra saber o regime de cada contraparte."]),
  ]));

  const wrap = el("div", { class: "icms-wrap" });

  // ---- formulario de novo/editar ----
  const inputCnpj = el("input", { type: "text", class: "icms-input", placeholder: "00.000.000/0000-00" });
  const inputRazao = el("input", { type: "text", class: "icms-input", placeholder: "Raz\u00e3o social (opcional)" });
  const selRegime = el("select", { class: "icms-select" });
  REGIMES_CADASTRO.forEach(r => selRegime.appendChild(el("option", { value: r.valor }, [r.rotulo])));
  const inputObs = el("input", { type: "text", class: "icms-input", placeholder: "Observa\u00e7\u00e3o (opcional)" });
  const btnSalvar = el("button", { class: "btn btn-primary" }, ["Salvar"]);
  const btnCancelarEdicao = el("button", { class: "btn", style: "display:none;" }, ["Cancelar edi\u00e7\u00e3o"]);
  const avisoForm = el("div", { class: "erro", id: "cadastro-regime-erro" });

  const linhaForm1 = el("div", { class: "icms-linha" }, [
    el("div", { class: "campo" }, [el("label", {}, ["CNPJ"]), inputCnpj]),
    el("div", { class: "campo" }, [el("label", {}, ["Regime Tribut\u00e1rio"]), selRegime]),
  ]);
  const linhaForm2 = el("div", { class: "icms-linha" }, [
    el("div", { class: "campo" }, [el("label", {}, ["Raz\u00e3o Social"]), inputRazao]),
    el("div", { class: "campo" }, [el("label", {}, ["Observa\u00e7\u00e3o"]), inputObs]),
  ]);

  // ---- busca + tabela ----
  const inputBusca = el("input", { type: "text", class: "icms-input", placeholder: "Buscar por CNPJ ou raz\u00e3o social..." });
  const corpoTabela = el("tbody");
  const tabela = el("table", { class: "tabela-simples" }, [
    el("thead", {}, [
      el("tr", {}, [
        el("th", {}, ["CNPJ"]),
        el("th", {}, ["Raz\u00e3o Social"]),
        el("th", {}, ["Regime"]),
        el("th", {}, ["Observa\u00e7\u00e3o"]),
        el("th", {}, [""]),
      ]),
    ]),
    corpoTabela,
  ]);

  let editandoCnpj = null;

  function limparForm() {
    inputCnpj.value = ""; inputCnpj.disabled = false;
    inputRazao.value = ""; inputObs.value = "";
    selRegime.value = REGIMES_CADASTRO[0].valor;
    editandoCnpj = null;
    btnSalvar.textContent = "Salvar";
    btnCancelarEdicao.style.display = "none";
    avisoForm.textContent = ""; avisoForm.className = "erro";
  }

  function preencherFormParaEdicao(registro) {
    inputCnpj.value = formatarCnpjExibicao(registro.cnpj);
    inputCnpj.disabled = true; // nao deixa trocar CNPJ no meio de uma edicao — exclui e recria se precisar
    inputRazao.value = registro.razao_social || "";
    inputObs.value = registro.observacao || "";
    selRegime.value = registro.regime_tributario;
    editandoCnpj = registro.cnpj;
    btnSalvar.textContent = "Salvar altera\u00e7\u00e3o";
    btnCancelarEdicao.style.display = "inline-block";
    avisoForm.textContent = ""; avisoForm.className = "erro";
  }

  async function carregarLista(busca) {
    corpoTabela.innerHTML = "";
    corpoTabela.appendChild(el("tr", {}, [el("td", { colspan: "5" }, ["Carregando..."])]));
    try {
      const qs = busca ? `?busca=${encodeURIComponent(busca)}` : "";
      const resp = await fetch(`/api/cadastro-regime${qs}`);
      const dados = await resp.json();
      corpoTabela.innerHTML = "";
      if (!dados.itens || !dados.itens.length) {
        corpoTabela.appendChild(el("tr", {}, [el("td", { colspan: "5" }, ["Nenhum registro encontrado."])]));
        return;
      }
      dados.itens.forEach(item => {
        const btnEditar = el("button", { class: "btn btn-pequeno" }, ["Editar"]);
        btnEditar.addEventListener("click", () => preencherFormParaEdicao(item));
        const btnExcluir = el("button", { class: "btn btn-pequeno rodape-btn-perigo" }, ["Excluir"]);
        btnExcluir.addEventListener("click", () => excluirRegistro(item));
        corpoTabela.appendChild(el("tr", {}, [
          el("td", {}, [formatarCnpjExibicao(item.cnpj)]),
          el("td", {}, [item.razao_social || "\u2014"]),
          el("td", {}, [rotuloRegime(item.regime_tributario)]),
          el("td", {}, [item.observacao || "\u2014"]),
          el("td", { class: "tabela-acoes" }, [btnEditar, btnExcluir]),
        ]));
      });
    } catch (e) {
      corpoTabela.innerHTML = "";
      corpoTabela.appendChild(el("tr", {}, [el("td", { colspan: "5" }, ["Erro ao carregar: " + e.message])]));
    }
  }

  async function excluirRegistro(item) {
    if (!confirm(`Excluir o cadastro de "${item.razao_social || formatarCnpjExibicao(item.cnpj)}"?`)) return;
    try {
      const resp = await fetch(`/api/cadastro-regime/${item.cnpj}`, { method: "DELETE" });
      if (!resp.ok) {
        const dados = await resp.json();
        alert(dados.detail || "Falha ao excluir.");
        return;
      }
      if (editandoCnpj === item.cnpj) limparForm();
      carregarLista(inputBusca.value.trim());
    } catch (e) {
      alert("Falha ao excluir: " + e.message);
    }
  }

  btnSalvar.addEventListener("click", async () => {
    avisoForm.textContent = ""; avisoForm.className = "erro";
    const cnpj = editandoCnpj || inputCnpj.value.trim();
    if (!cnpj) {
      avisoForm.textContent = "Informe o CNPJ."; avisoForm.className = "erro visivel";
      return;
    }
    btnSalvar.disabled = true;
    try {
      const resp = await fetch("/api/cadastro-regime", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          cnpj,
          regime_tributario: selRegime.value,
          razao_social: inputRazao.value.trim() || null,
          observacao: inputObs.value.trim() || null,
        }),
      });
      const dados = await resp.json();
      if (!resp.ok) {
        avisoForm.textContent = dados.detail || "Falha ao salvar."; avisoForm.className = "erro visivel";
        return;
      }
      limparForm();
      carregarLista(inputBusca.value.trim());
    } catch (e) {
      avisoForm.textContent = "Falha ao salvar: " + e.message; avisoForm.className = "erro visivel";
    } finally {
      btnSalvar.disabled = false;
    }
  });

  btnCancelarEdicao.addEventListener("click", limparForm);

  let debounceBusca;
  inputBusca.addEventListener("input", () => {
    clearTimeout(debounceBusca);
    debounceBusca = setTimeout(() => carregarLista(inputBusca.value.trim()), 300);
  });

  wrap.appendChild(el("div", { class: "icms-secao" }, [el("h3", {}, ["Novo cadastro / editar"])]));
  wrap.appendChild(linhaForm1);
  wrap.appendChild(linhaForm2);
  wrap.appendChild(el("div", { class: "icms-linha" }, [btnSalvar, btnCancelarEdicao]));
  wrap.appendChild(avisoForm);
  wrap.appendChild(el("div", { class: "icms-secao" }, [el("h3", {}, ["Cadastrados"])]));
  wrap.appendChild(inputBusca);
  wrap.appendChild(tabela);

  conteudo.appendChild(wrap);
  carregarLista();
}

// ---------------------------------------------------------------------
// ---------------------------------------------------------------------
// Simulador IBS/CBS — 2 modos:
//   "planilha" (padrao) = calcula Faturamento e % despesas automatico a
//     partir das planilhas do NBS (mesmo formato do PIS/COFINS), regime
//     sempre Regime Geral (fato conhecido da Riozen).
//   "manual" = formulario livre (regime, faturamento, % despesas todos
//     digitados a mao), pra simular outras empresas/regimes sem planilha.
// Mix de fornecedores e mix de clientes continuam manuais nos dois modos
// (dependem do cadastro de CNPJ, que ainda esta pendente).
// ---------------------------------------------------------------------
const ANOS_SIMULADOR = [2027, 2028, 2029, 2030, 2031, 2032, 2033];
const ANEXOS_SIMPLES = ["I", "II", "III", "IV", "V"];

function telaSimuladorIbsCbs(voltarFn) {
  const conteudo = document.getElementById("conteudo");
  conteudo.innerHTML = "";
  renderAcoesNav(voltarFn);
  conteudo.appendChild(el("div", { class: "titulo-tela" }, [
    el("h2", {}, ["Simulador de Impactos IBS/CBS"]),
    el("p", {}, ["Estimativa gerencial do impacto da Reforma Tribut\u00e1ria na forma\u00e7\u00e3o de pre\u00e7o. N\u00e3o substitui apura\u00e7\u00e3o fiscal formal \u2014 n\u00e3o calcula ICMS, ISS, IRPJ/CSLL nem Imposto Seletivo."]),
  ]));

  const wrap = el("div", { class: "icms-wrap" });
  let referenciaCache = null;
  let modo = "planilha"; // "planilha" | "manual"

  // ---- alternador de modo ----
  const btnModoPlanilha = el("button", { class: "btn btn-primary" }, ["\ud83d\udcca Calcular pelas planilhas (Riozen)"]);
  const btnModoManual = el("button", { class: "btn" }, ["\u270f\ufe0f Simula\u00e7\u00e3o manual (outras empresas)"]);
  const linhaModo = el("div", { class: "icms-linha" }, [btnModoPlanilha, btnModoManual]);

  // ---- campos comuns aos dois modos ----
  const selAno = el("select", { class: "icms-select" });
  ANOS_SIMULADOR.forEach(a => selAno.appendChild(el("option", { value: String(a) }, [String(a)])));
  const inputAliqGeral = el("input", { type: "number", step: "0.01", class: "icms-input", placeholder: "9.21" });

  const inputFaturamento = el("input", { type: "number", class: "icms-input", placeholder: "500000" });
  const avisoFaturamento = el("div", { class: "erro" });
  const inputPctDesp = el("input", { type: "range", min: "0", max: "100", value: "50", class: "icms-input" });
  const labelPctDesp = el("span", {}, ["50%"]);

  const inputPctFornDas = el("input", { type: "range", min: "0", max: "100", value: "30", class: "icms-input" });
  const labelPctFornDas = el("span", {}, ["30% Simples DAS / 70% Regime Geral"]);
  const inputPctCliCredito = el("input", { type: "range", min: "0", max: "100", value: "50", class: "icms-input" });
  const labelPctCliCredito = el("span", {}, ["50% com cr\u00e9dito / 50% sem cr\u00e9dito"]);

  inputPctDesp.addEventListener("input", () => labelPctDesp.textContent = `${inputPctDesp.value}%`);
  inputPctFornDas.addEventListener("input", () => {
    const v = inputPctFornDas.value;
    labelPctFornDas.textContent = `${v}% Simples DAS / ${100 - v}% Regime Geral`;
  });
  inputPctCliCredito.addEventListener("input", () => {
    const v = inputPctCliCredito.value;
    labelPctCliCredito.textContent = `${v}% com cr\u00e9dito / ${100 - v}% sem cr\u00e9dito`;
  });
  selAno.addEventListener("change", () => {
    if (referenciaCache && referenciaCache.aliquota_regime_geral_por_ano[selAno.value] != null) {
      inputAliqGeral.value = (referenciaCache.aliquota_regime_geral_por_ano[selAno.value] * 100).toFixed(2);
    }
  });
  inputFaturamento.addEventListener("input", () => {
    const v = parseFloat(inputFaturamento.value || "0");
    if (v > 4800000) {
      avisoFaturamento.textContent = "Acima de R$ 4.800.000,00 \u2014 empresa n\u00e3o pode ficar no Simples DAS (mas pode simular Regime Geral ou Simples fora da DAS).";
      avisoFaturamento.className = "erro visivel";
    } else {
      avisoFaturamento.className = "erro";
    }
  });

  const linhaAnoAliq = el("div", { class: "icms-linha" }, [
    el("div", { class: "campo" }, [el("label", {}, ["Ano da simula\u00e7\u00e3o"]), selAno]),
    el("div", { class: "campo" }, [el("label", {}, ["Al\u00edquota Regime Geral (%)"]), inputAliqGeral]),
  ]);
  const linhaFornCli = [
    el("div", { class: "campo" }, [el("label", {}, ["Mix de fornecedores"]), inputPctFornDas, labelPctFornDas]),
    el("div", { class: "campo" }, [el("label", {}, ["Mix de clientes (com direito a cr\u00e9dito)"]), inputPctCliCredito, labelPctCliCredito]),
  ];

  // ==== BLOCO MODO "planilha" ====
  const inputPlanilhaSaida = el("input", { type: "file", accept: ".xls,.xlsx", multiple: "multiple", class: "icms-file" });
  const inputPlanilhaEntrada = el("input", { type: "file", accept: ".xls,.xlsx", multiple: "multiple", class: "icms-file" });
  const btnCalcularPlanilha = el("button", { class: "btn" }, ["Calcular Faturamento/% Despesas da planilha"]);
  const areaResultadoPlanilha = el("div", {});
  const areaErroPlanilha = el("div", { class: "erro" });

  const blocoPlanilha = el("div", {}, [
    el("div", { class: "icms-linha" }, [
      el("div", { class: "campo" }, [el("label", {}, ["Planilha(s) de Sa\u00edda (Lista Pis Cofins)"]), inputPlanilhaSaida]),
      el("div", { class: "campo" }, [el("label", {}, ["Planilha(s) de Entrada (NBS, por filial)"]), inputPlanilhaEntrada]),
    ]),
    btnCalcularPlanilha,
    areaErroPlanilha,
    areaResultadoPlanilha,
    el("div", { class: "icms-linha", style: "margin-top:14px;" }, [
      el("div", { class: "campo" }, [el("label", {}, ["Faturamento (calculado \u2014 ainda edit\u00e1vel)"]), inputFaturamento, avisoFaturamento]),
      el("div", { class: "campo" }, [el("label", {}, ["% da Receita sujeita a despesas tributadas (calculado \u2014 ainda edit\u00e1vel)"]), inputPctDesp, labelPctDesp]),
    ]),
  ]);

  btnCalcularPlanilha.addEventListener("click", async () => {
    areaErroPlanilha.className = "erro";
    areaResultadoPlanilha.innerHTML = "";
    if (!inputPlanilhaSaida.files.length || !inputPlanilhaEntrada.files.length) {
      areaErroPlanilha.textContent = "Selecione ao menos uma planilha de Sa\u00edda e uma de Entrada.";
      areaErroPlanilha.className = "erro visivel";
      return;
    }
    btnCalcularPlanilha.disabled = true;
    btnCalcularPlanilha.textContent = "Calculando...";
    try {
      const fd = new FormData();
      Array.from(inputPlanilhaSaida.files).forEach(f => fd.append("planilhas_saida", f));
      Array.from(inputPlanilhaEntrada.files).forEach(f => fd.append("planilhas_entrada", f));
      const resp = await fetch("/api/reforma-simulador/calcular-da-planilha", { method: "POST", body: fd });
      const dados = await resp.json();
      if (!resp.ok) {
        areaErroPlanilha.textContent = dados.detail || "Falha ao ler as planilhas.";
        areaErroPlanilha.className = "erro visivel";
        return;
      }
      inputFaturamento.value = dados.faturamento_total.toFixed(2);
      inputPctDesp.value = String(Math.round(dados.pct_desp * 100));
      labelPctDesp.textContent = `${inputPctDesp.value}% (calculado: ${(dados.pct_desp * 100).toFixed(2)}%)`;
      areaResultadoPlanilha.appendChild(el("div", { class: "icms-nota ok" }, [
        `Faturamento: R$ ${dados.faturamento_total.toLocaleString("pt-BR", {minimumFractionDigits:2})} \u00b7 `,
        `Despesa creditável: R$ ${dados.despesa_creditavel_total.toLocaleString("pt-BR", {minimumFractionDigits:2})} \u00b7 `,
        `% despesas: ${(dados.pct_desp * 100).toFixed(2)}%`,
      ]));
      const detalhes = [...dados.detalhe_saida.map(d => `Sa\u00edda ${d.arquivo}: R$ ${d.fat_bruto.toLocaleString("pt-BR",{minimumFractionDigits:2})}`),
                        ...dados.detalhe_entrada.map(d => `Entrada ${d.arquivo}: R$ ${d.despesa_creditavel.toLocaleString("pt-BR",{minimumFractionDigits:2})} (${d.itens} itens)`)];
      areaResultadoPlanilha.appendChild(el("pre", { class: "icms-log" }, [detalhes.join("\n")]));
    } catch (e) {
      areaErroPlanilha.textContent = "Falha ao calcular: " + e.message;
      areaErroPlanilha.className = "erro visivel";
    } finally {
      btnCalcularPlanilha.disabled = false;
      btnCalcularPlanilha.textContent = "Calcular Faturamento/% Despesas da planilha";
    }
  });

  // ==== BLOCO MODO "manual" ====
  const selRegime = el("select", { class: "icms-select" }, [
    el("option", { value: "regime_geral" }, ["Regime Geral"]),
    el("option", { value: "simples_das" }, ["Simples Nacional (DAS)"]),
    el("option", { value: "simples_fora_das" }, ["Simples Nacional fora da DAS"]),
  ]);
  const campoAnexo = el("div", { class: "campo", id: "campo-anexo", style: "display:none;" });
  const selAnexo = el("select", { class: "icms-select" });
  ANEXOS_SIMPLES.forEach(a => selAnexo.appendChild(el("option", { value: a }, [`Anexo ${a}`])));
  campoAnexo.appendChild(el("label", {}, ["Anexo do Simples"]));
  campoAnexo.appendChild(selAnexo);
  const selCnae = el("select", { class: "icms-select" }, [
    el("option", { value: "" }, ["(nenhum \u2014 usar % manual)"]),
    el("option", { value: "45" }, ["45 \u2014 Com\u00e9rcio de ve\u00edculos, pe\u00e7as e acess\u00f3rios"]),
  ]);
  selCnae.addEventListener("change", () => {
    if (!referenciaCache || !selCnae.value) return;
    const cnae = referenciaCache.cnae_sugestoes[selCnae.value];
    if (cnae && cnae.pct_despesas_sugerido != null) {
      inputPctDespManual.value = String(Math.round(cnae.pct_despesas_sugerido * 100));
      labelPctDespManual.textContent = `${inputPctDespManual.value}%`;
    }
    if (cnae && cnae.anexo_simples) selAnexo.value = cnae.anexo_simples;
  });

  function atualizarVisibilidadeAnexo() {
    campoAnexo.style.display = selRegime.value === "simples_das" ? "block" : "none";
  }
  selRegime.addEventListener("change", atualizarVisibilidadeAnexo);

  // no modo manual, faturamento/%despesas sao os MESMOS inputs
  // compartilhados (inputFaturamento/inputPctDesp) — so muda o que fica
  // visivel ao redor deles (regime, anexo, CNAE) e o fato de nao ter
  // planilha nem calculo automatico.
  const inputPctDespManual = inputPctDesp;
  const labelPctDespManual = labelPctDesp;

  const blocoManual = el("div", {}, [
    el("div", { class: "icms-linha" }, [
      el("div", { class: "campo" }, [el("label", {}, ["Regime Tribut\u00e1rio da empresa simulada"]), selRegime]),
      campoAnexo,
    ]),
    el("div", { class: "icms-linha" }, [
      el("div", { class: "campo" }, [el("label", {}, ["Faturamento (anual, ou 12 meses se Simples)"]), inputFaturamento, avisoFaturamento]),
      el("div", { class: "campo" }, [el("label", {}, ["CNAE (atalho pra sugerir % de despesas)"]), selCnae]),
    ]),
    el("div", { class: "campo" }, [el("label", {}, ["% da Receita sujeita a despesas tributadas pelo IBS/CBS"]), inputPctDesp, labelPctDesp]),
  ]);

  const areaCamposVariaveis = el("div", {});

  function aplicarModo() {
    areaCamposVariaveis.innerHTML = "";
    if (modo === "planilha") {
      btnModoPlanilha.className = "btn btn-primary";
      btnModoManual.className = "btn";
      areaCamposVariaveis.appendChild(blocoPlanilha);
    } else {
      btnModoPlanilha.className = "btn";
      btnModoManual.className = "btn btn-primary";
      areaCamposVariaveis.appendChild(blocoManual);
      atualizarVisibilidadeAnexo();
    }
  }
  btnModoPlanilha.addEventListener("click", () => { modo = "planilha"; aplicarModo(); });
  btnModoManual.addEventListener("click", () => { modo = "manual"; aplicarModo(); });

  // ---- calcular / resultado ----
  const btnCalcular = el("button", { class: "btn btn-primary" }, ["Calcular"]);
  const areaResultado = el("div", { id: "simulador-resultado" });
  const areaErro = el("div", { class: "erro" });

  const CENARIOS_ROTULO = { "0": "0% aproveitamento", "real": "Mix real (informado)", "100": "100% aproveitamento" };
  let ultimoResultado = null;
  let cenarioAtivo = "real";
  let valorProdutoDigitado = "";

  function linhaIndicador(desc, valor) {
    return el("tr", {}, [el("td", {}, [desc]), el("td", {}, [`R$ ${Number(valor).toFixed(2)}`])]);
  }

  function renderResultado() {
    areaResultado.innerHTML = "";
    if (!ultimoResultado) return;
    const c = ultimoResultado.cenarios[cenarioAtivo];

    const botoesCenario = el("div", { class: "icms-linha" });
    Object.keys(CENARIOS_ROTULO).forEach(chave => {
      const btn = el("button", { class: "btn" + (chave === cenarioAtivo ? " btn-primary" : "") }, [CENARIOS_ROTULO[chave]]);
      btn.addEventListener("click", () => { cenarioAtivo = chave; renderResultado(); });
      botoesCenario.appendChild(btn);
    });
    areaResultado.appendChild(botoesCenario);

    areaResultado.appendChild(el("div", { class: "icms-nota ok", style: "font-size:20px;margin-top:14px;" }, [
      `Pre\u00e7o de venda: R$ ${c.preco_venda.toFixed(2)}`,
    ]));

    if (c.valores_reais) {
      const vr = c.valores_reais;
      areaResultado.appendChild(el("div", { class: "icms-nota ok", style: "font-size:22px;font-weight:700;margin-top:10px;background:rgba(45,164,120,0.15);padding:16px;border-radius:8px;" }, [
        `IBS/CBS a pagar no per\u00edodo (faturamento de R$ ${vr.faturamento_base.toLocaleString("pt-BR",{minimumFractionDigits:2})}): `,
        el("br", {}, []),
        `R$ ${vr.ibs_cbs_devido.toLocaleString("pt-BR",{minimumFractionDigits:2})}`,
      ]));
      const tabelaReal = el("table", { class: "tabela-simples" }, [
        el("thead", {}, [el("tr", {}, [el("th", {}, ["Indicador"]), el("th", {}, ["Valor real (R$)"])])]),
        el("tbody", {}, [
          linhaIndicador("Cr\u00e9dito recebido dos fornecedores", vr.credito_entrada),
          linhaIndicador("IBS/CBS devido pela empresa", vr.ibs_cbs_devido),
          linhaIndicador("Cr\u00e9dito aproveitado pelo cliente", vr.credito_cliente),
          linhaIndicador("Pre\u00e7o de venda", vr.preco_venda),
          linhaIndicador("Custo l\u00edquido efetivo do cliente", vr.custo_liquido_cliente),
        ]),
      ]);
      areaResultado.appendChild(tabelaReal);
      areaResultado.appendChild(el("div", { class: "icms-secao" }, [el("h3", {}, ["Detalhamento por R$ 100 (proporcional)"])]));
    }

    const tabela = el("table", { class: "tabela-simples" }, [
      el("thead", {}, [el("tr", {}, [el("th", {}, ["Indicador"]), el("th", {}, ["Valor (base R$ 100)"])])]),
      el("tbody", {}, [
        linhaIndicador("Pre\u00e7o inicial (sem IBS/CBS)", c.preco_inicial),
        linhaIndicador("Cr\u00e9dito recebido dos fornecedores", c.credito_entrada),
        linhaIndicador("Base ap\u00f3s cr\u00e9ditos de entrada", c.base_apos_credito),
        linhaIndicador("IBS/CBS devido pela empresa", c.ibs_cbs_devido),
        linhaIndicador("Cr\u00e9dito aproveitado pelo cliente", c.credito_cliente),
        linhaIndicador("Pre\u00e7o de venda", c.preco_venda),
        linhaIndicador("Custo l\u00edquido efetivo do cliente", c.custo_liquido_cliente),
      ]),
    ]);
    areaResultado.appendChild(tabela);

    if (ultimoResultado.comparativo) {
      const comp = ultimoResultado.comparativo;
      areaResultado.appendChild(el("div", { class: "icms-secao" }, [el("h3", {}, [`Comparativo: ${comp.label_a} \u00d7 ${comp.label_b}`])]));
      const tabelaComp = el("table", { class: "tabela-simples" }, [
        el("thead", {}, [el("tr", {}, [
          el("th", {}, ["Indicador"]), el("th", {}, [comp.label_a]), el("th", {}, [comp.label_b]), el("th", {}, ["Varia\u00e7\u00e3o"]),
        ])]),
        el("tbody", {}, comp.linhas.map(l => el("tr", {}, [
          el("td", {}, [l.descricao]),
          el("td", {}, [`R$ ${l.valor_a.toFixed(2)}`]),
          el("td", {}, [`R$ ${l.valor_b.toFixed(2)}`]),
          el("td", {}, [l.variacao_pct == null ? "\u2014" : `${(l.variacao_pct * 100).toFixed(1)}%`]),
        ]))),
      ]);
      areaResultado.appendChild(tabelaComp);
    }

    areaResultado.appendChild(el("div", { class: "icms-secao" }, [el("h3", {}, ["Mem\u00f3ria de c\u00e1lculo"])]));
    areaResultado.appendChild(el("pre", { class: "icms-log" }, [c.memoria_calculo.join("\n")]));

    areaResultado.appendChild(el("div", { class: "icms-secao" }, [el("h3", {}, ["Calcular pra um produto espec\u00edfico"])]));
    const inputValorProduto = el("input", {
      type: "number", step: "0.01", class: "icms-input",
      placeholder: "Ex: 1300.00", value: valorProdutoDigitado,
      style: "max-width:220px;",
    });
    const areaProduto = el("div", { style: "margin-top:10px;" });

    function recalcularProduto() {
      const valor = parseFloat(inputValorProduto.value);
      areaProduto.innerHTML = "";
      if (!valor || valor <= 0) return;
      const fator = valor / 100;
      const ibsCbs = c.ibs_cbs_devido * fator;
      const precoVenda = c.preco_venda * fator;
      const creditoCliente = c.credito_cliente * fator;
      const custoLiquido = c.custo_liquido_cliente * fator;
      areaProduto.appendChild(el("div", {
        class: "icms-nota ok",
        style: "font-size:18px;font-weight:700;background:rgba(45,164,120,0.15);padding:14px;border-radius:8px;",
      }, [
        `Produto de R$ ${valor.toLocaleString("pt-BR",{minimumFractionDigits:2})} \u2192 IBS/CBS devido: `,
        `R$ ${ibsCbs.toLocaleString("pt-BR",{minimumFractionDigits:2})}`,
      ]));
      areaProduto.appendChild(el("table", { class: "tabela-simples" }, [
        el("thead", {}, [el("tr", {}, [el("th", {}, ["Indicador"]), el("th", {}, ["Valor (R$)"])])]),
        el("tbody", {}, [
          linhaIndicador("Valor do produto (sem IBS/CBS)", valor),
          linhaIndicador("IBS/CBS devido", ibsCbs),
          linhaIndicador("Cr\u00e9dito aproveitado pelo cliente", creditoCliente),
          linhaIndicador("Pre\u00e7o de venda final", precoVenda),
          linhaIndicador("Custo l\u00edquido efetivo do cliente", custoLiquido),
        ]),
      ]));
    }
    inputValorProduto.addEventListener("input", () => {
      valorProdutoDigitado = inputValorProduto.value;
      recalcularProduto();
    });
    areaResultado.appendChild(el("div", { class: "campo" }, [el("label", {}, ["Valor do produto (R$)"]), inputValorProduto]));
    areaResultado.appendChild(areaProduto);
    recalcularProduto();

    const btnImprimir = el("button", { class: "btn", style: "margin-top:14px;" }, ["Imprimir Resultado"]);
    btnImprimir.addEventListener("click", () => window.print());
    areaResultado.appendChild(btnImprimir);
  }

  btnCalcular.addEventListener("click", async () => {
    areaErro.className = "erro";
    areaResultado.innerHTML = "";
    btnCalcular.disabled = true;
    btnCalcular.textContent = "Calculando...";
    try {
      const regime = modo === "planilha" ? "regime_geral" : selRegime.value;
      const body = {
        regime,
        ano: parseInt(selAno.value, 10),
        aliq_geral: parseFloat(inputAliqGeral.value || "0") / 100,
        faturamento_12m: parseFloat(inputFaturamento.value || "0"),
        pct_desp: parseFloat(inputPctDesp.value) / 100,
        pct_forn_das: parseFloat(inputPctFornDas.value) / 100,
        pct_cli_com_credito: parseFloat(inputPctCliCredito.value) / 100,
        anexo: regime === "simples_das" ? selAnexo.value : null,
      };
      const resp = await fetch("/api/reforma-simulador/simular", {
        method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body),
      });
      const dados = await resp.json();
      if (!resp.ok) {
        areaErro.textContent = dados.detail || "Falha ao calcular.";
        areaErro.className = "erro visivel";
        return;
      }
      ultimoResultado = dados;
      cenarioAtivo = "real";
      renderResultado();
    } catch (e) {
      areaErro.textContent = "Falha ao calcular: " + e.message;
      areaErro.className = "erro visivel";
    } finally {
      btnCalcular.disabled = false;
      btnCalcular.textContent = "Calcular";
    }
  });

  wrap.appendChild(linhaModo);
  wrap.appendChild(linhaAnoAliq);
  wrap.appendChild(areaCamposVariaveis);
  wrap.appendChild(el("div", { class: "icms-linha" }, linhaFornCli));
  wrap.appendChild(btnCalcular);
  wrap.appendChild(areaErro);

// ---------------------------------------------------------------------
// CBS/IBS — Apuração (débito - crédito, alíquotas separadas editáveis)
// ---------------------------------------------------------------------
function telaCbsIbs(voltarFn) {
  const conteudo = document.getElementById("conteudo");
  conteudo.innerHTML = "";
  renderAcoesNav(voltarFn);
  conteudo.appendChild(el("div", { class: "titulo-tela" }, [
    el("h2", {}, ["CBS/IBS \u2014 Apura\u00e7\u00e3o"]),
    el("p", {}, ["D\u00e9bito (sa\u00eddas) menos Cr\u00e9dito (entradas) do per\u00edodo, conforme LC 214/2025. Base de c\u00e1lculo \u2018por fora\u2019 (art. 12) e cr\u00e9dito amplo sobre entradas com CFOP (art. 47). An\u00e1lise de fornecedores ainda n\u00e3o entra aqui \u2014 fica pra quando o cadastro de regime tribut\u00e1rio estiver ligado."]),
  ]));

  const wrap = el("div", { class: "icms-wrap" });
  let referenciaCache = null;

  const selAno = el("select", { class: "icms-select" });
  [2026, 2027, 2028].forEach(a => selAno.appendChild(el("option", { value: String(a) }, [String(a)])));
  selAno.value = "2027";

  const inputPeriodo = el("input", { type: "text", class: "icms-input", placeholder: "MM/AAAA" });
  const hoje = new Date();
  inputPeriodo.value = String(hoje.getMonth() + 1).padStart(2, "0") + "/" + hoje.getFullYear();

  const inputAliqDebito = el("input", { type: "number", step: "0.001", class: "icms-input", placeholder: "8.50" });
  const inputAliqCredito = el("input", { type: "number", step: "0.001", class: "icms-input", placeholder: "8.50" });

  function aplicarAliquotaPadrao() {
    if (!referenciaCache) return;
    const aliq = referenciaCache.aliquotas_por_ano[selAno.value];
    if (aliq != null) {
      inputAliqDebito.value = (aliq * 100).toFixed(3);
      inputAliqCredito.value = (aliq * 100).toFixed(3);
    } else {
      inputAliqDebito.value = ""; inputAliqCredito.value = "";
      avisoAliquota.textContent = `N\u00e3o h\u00e1 al\u00edquota combinada confirmada pra ${selAno.value} \u2014 preencha manualmente ou aguarde publica\u00e7\u00e3o oficial.`;
      avisoAliquota.className = "erro visivel";
      return;
    }
    avisoAliquota.className = "erro";
  }
  selAno.addEventListener("change", aplicarAliquotaPadrao);

  const avisoAliquota = el("div", { class: "erro" });

  const inputSaida = el("input", { type: "file", accept: ".xls,.xlsx", multiple: "multiple", class: "icms-file" });
  const inputEntrada = el("input", { type: "file", accept: ".xls,.xlsx", multiple: "multiple", class: "icms-file" });

  const linha1 = el("div", { class: "icms-linha" }, [
    el("div", { class: "campo" }, [el("label", {}, ["Per\u00edodo"]), inputPeriodo]),
    el("div", { class: "campo" }, [el("label", {}, ["Ano de refer\u00eancia (al\u00edquota)"]), selAno]),
  ]);
  const linha2 = el("div", { class: "icms-linha" }, [
    el("div", { class: "campo" }, [el("label", {}, ["Al\u00edquota D\u00e9bito (%)"]), inputAliqDebito]),
    el("div", { class: "campo" }, [el("label", {}, ["Al\u00edquota Cr\u00e9dito (%)"]), inputAliqCredito]),
  ]);
  const linha3 = el("div", { class: "icms-linha" }, [
    el("div", { class: "campo" }, [el("label", {}, ["Planilha(s) de Sa\u00edda (D\u00e9bito)"]), inputSaida]),
    el("div", { class: "campo" }, [el("label", {}, ["Planilha(s) de Entrada (Cr\u00e9dito)"]), inputEntrada]),
  ]);

  const btnApurar = el("button", { class: "btn btn-primary" }, ["Apurar"]);
  const areaErro = el("div", { class: "erro" });
  const areaLog = el("pre", { class: "icms-log" }, []);
  const areaResultado = el("div", {});

  btnApurar.addEventListener("click", async () => {
    areaErro.className = "erro"; areaLog.textContent = ""; areaResultado.innerHTML = "";
    if (!inputSaida.files.length || !inputEntrada.files.length) {
      areaErro.textContent = "Selecione ao menos uma planilha de Sa\u00edda e uma de Entrada.";
      areaErro.className = "erro visivel";
      return;
    }
    btnApurar.disabled = true;
    btnApurar.textContent = "Apurando...";
    try {
      const fd = new FormData();
      fd.append("periodo", inputPeriodo.value);
      fd.append("ano", selAno.value);
      fd.append("aliq_debito", (parseFloat(inputAliqDebito.value || "0") / 100).toString());
      fd.append("aliq_credito", (parseFloat(inputAliqCredito.value || "0") / 100).toString());
      Array.from(inputSaida.files).forEach(f => fd.append("planilhas_saida", f));
      Array.from(inputEntrada.files).forEach(f => fd.append("planilhas_entrada", f));

      const resp = await fetch("/api/cbs-ibs/apurar", { method: "POST", body: fd });
      const logB64 = resp.headers.get("X-Log-B64");
      if (logB64) {
        try { areaLog.textContent = JSON.parse(decodeURIComponent(escape(atob(logB64)))).join("\n"); } catch (e) {}
      }
      if (!resp.ok) {
        const dados = await resp.json();
        areaErro.textContent = dados.erro || "Falha ao apurar.";
        areaErro.className = "erro visivel";
        if (dados.logs) areaLog.textContent = dados.logs.join("\n");
        return;
      }
      const valorApurado = parseFloat(resp.headers.get("X-Valor-Apurado") || "0");
      const blob = await resp.blob();
      const nomeArquivo = (resp.headers.get("Content-Disposition") || "").match(/filename="?([^"]+)"?/);
      const nome = nomeArquivo ? nomeArquivo[1] : "apuracao_cbs_ibs.xlsx";

      const rotulo = valorApurado >= 0 ? "Valor a pagar" : "Saldo credor (a compensar)";
      areaResultado.appendChild(el("div", {
        class: "icms-nota ok",
        style: "font-size:20px;font-weight:700;background:rgba(45,164,120,0.15);padding:16px;border-radius:8px;",
      }, [`${rotulo}: R$ ${Math.abs(valorApurado).toLocaleString("pt-BR",{minimumFractionDigits:2})}`]));

      const url = URL.createObjectURL(blob);
      const link = el("a", { href: url, download: nome, class: "pcofins-download" }, [`\u2b07\ufe0f ${nome}`]);
      areaResultado.appendChild(link);
    } catch (e) {
      areaErro.textContent = "Falha ao apurar: " + e.message;
      areaErro.className = "erro visivel";
    } finally {
      btnApurar.disabled = false;
      btnApurar.textContent = "Apurar";
    }
  });

  wrap.appendChild(linha1);
  wrap.appendChild(linha2);
  wrap.appendChild(avisoAliquota);
  wrap.appendChild(linha3);
  wrap.appendChild(btnApurar);
  wrap.appendChild(areaErro);
  wrap.appendChild(el("div", { class: "icms-rotulo-log" }, ["Log"]));
  wrap.appendChild(areaLog);
  wrap.appendChild(areaResultado);
  conteudo.appendChild(wrap);

  fetch("/api/cbs-ibs/referencia").then(r => r.json()).then(dados => {
    referenciaCache = dados;
    aplicarAliquotaPadrao();
  }).catch(() => {});
}

  renderBreadcrumb([
    { rotulo: "Configurações" },
  ]);

  conteudo.innerHTML = "";
  renderAcoesNav(voltarFn);
  conteudo.appendChild(el("div", { class: "titulo-tela" }, [
    el("h2", {}, ["⚙ Configurações"]),
  ]));

  const isAdmin = USUARIO && USUARIO.perfil_acesso === "admin";

  const ABAS_CFG = [
    { id: "modo", rotulo: "🎨 Modo", render: renderAbaModo },
  ];
  if (isAdmin) {
    ABAS_CFG.push({ id: "usuarios", rotulo: "👥 Usuários", render: renderAbaUsuarios });
    ABAS_CFG.push({ id: "modelos", rotulo: "📦 Modelos", render: renderAbaModelos });
    ABAS_CFG.push({ id: "empresas", rotulo: "🏢 Empresas", render: renderAbaEmpresas });
  }
  ABAS_CFG.push({ id: "senha", rotulo: "🔑 Alterar Senha", render: renderAbaSenha });
  ABAS_CFG.push({ id: "log", rotulo: "📊 Log", render: renderAbaLog });

  const wrap = el("div", { class: "cfg-wrap" });
  const painelAbas = el("div", { class: "cfg-abas" });
  const painelConteudo = el("div", { class: "cfg-conteudo" });

  let abaAtiva = ABAS_CFG[0].id;

  function mostrarAba(id) {
    abaAtiva = id;
    [...painelAbas.children].forEach(b => b.classList.toggle("ativa", b.dataset.aba === id));
    painelConteudo.innerHTML = "";
    const aba = ABAS_CFG.find(a => a.id === id);
    if (aba) aba.render(painelConteudo);
  }

  ABAS_CFG.forEach(aba => {
    const btn = el("button", { class: "cfg-aba-btn" }, [aba.rotulo]);
    btn.dataset.aba = aba.id;
    btn.addEventListener("click", () => mostrarAba(aba.id));
    painelAbas.appendChild(btn);
  });

  wrap.appendChild(painelAbas);
  wrap.appendChild(painelConteudo);
  conteudo.appendChild(wrap);
  mostrarAba(abaAtiva);
}

// ==== ABA: Alterar Senha ================================================
function renderAbaSenha(container) {
  container.appendChild(el("h3", {}, ["Alterar Senha"]));
  container.appendChild(el("p", { class: "sub" }, ["Digite sua senha atual e escolha uma nova senha."]));

  const inputAtual = el("input", { type: "password", class: "icms-input" });
  const inputNova = el("input", { type: "password", class: "icms-input" });
  const inputConfirma = el("input", { type: "password", class: "icms-input" });
  const areaErro = el("div", { class: "erro" });

  container.appendChild(el("div", { class: "campo" }, [el("label", {}, ["Senha atual"]), inputAtual]));
  container.appendChild(el("div", { class: "campo" }, [el("label", {}, ["Nova senha"]), inputNova]));
  container.appendChild(el("div", { class: "campo" }, [el("label", {}, ["Confirmar nova"]), inputConfirma]));

  const btn = el("button", { class: "btn btn-primary" }, ["Salvar Nova Senha"]);
  btn.addEventListener("click", async () => {
    areaErro.className = "erro";
    btn.disabled = true;
    try {
      const resp = await fetch("/api/configuracoes/alterar-senha", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          senha_atual: inputAtual.value, nova_senha: inputNova.value, confirmar: inputConfirma.value,
        }),
      });
      const dados = await resp.json();
      if (!resp.ok) {
        areaErro.textContent = dados.detail || "Falha ao alterar senha.";
        areaErro.className = "erro visivel";
        return;
      }
      inputAtual.value = ""; inputNova.value = ""; inputConfirma.value = "";
      areaErro.textContent = "✅ Senha alterada com sucesso!";
      areaErro.className = "erro visivel";
      areaErro.style.color = "#2da478";
      areaErro.style.background = "rgba(45,164,120,0.12)";
      areaErro.style.borderColor = "rgba(45,164,120,0.4)";
    } catch (e) {
      areaErro.textContent = "Falha ao alterar senha: " + e.message;
      areaErro.className = "erro visivel";
    } finally {
      btn.disabled = false;
    }
  });
  container.appendChild(btn);
  container.appendChild(areaErro);
}
