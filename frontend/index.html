// ==== ABA: Usuários ======================================================
function renderAbaUsuarios(container) {
  container.appendChild(el("h3", {}, ["Usuários"]));
  const areaLista = el("div", {});
  container.appendChild(areaLista);

  function rotuloBadge(ativo) {
    return el("span", { class: "cfg-badge " + (ativo ? "ok" : "off") }, [ativo ? "● ATIVO" : "● INATIVO"]);
  }

  async function carregar() {
    areaLista.innerHTML = "Carregando...";
    const resp = await fetch("/api/configuracoes/usuarios");
    const dados = await resp.json();
    areaLista.innerHTML = "";
    dados.itens.forEach(u => renderCard(u));
  }

  function renderCard(u) {
    const card = el("div", { class: "cfg-usuario-card" });
    const linha1 = el("div", { class: "cfg-usuario-linha1" }, [
      el("strong", {}, [u.nome]),
      el("span", { class: "sub" }, [`@${u.login}`]),
      el("span", { class: "cfg-badge" }, [u.setor]),
      el("span", { class: "cfg-badge" }, [u.perfil.toUpperCase()]),
      rotuloBadge(u.ativo),
    ]);
    if (u.email) linha1.appendChild(el("span", { class: "sub" }, [`✉ ${u.email}`]));
    card.appendChild(linha1);

    const linha2 = el("div", { class: "cfg-usuario-linha2" });
    const btnEditar = el("button", { class: "btn btn-pequeno" }, ["✎ Editar"]);
    linha2.appendChild(btnEditar);
    if (u.login !== "admin") {
      const btnToggle = el("button", { class: "btn btn-pequeno" }, [u.ativo ? "● Desativar" : "● Ativar"]);
      btnToggle.addEventListener("click", async () => {
        await fetch(`/api/configuracoes/usuarios/${u.id}/toggle-ativo`, { method: "POST" });
        carregar();
      });
      linha2.appendChild(btnToggle);
      const btnExcluir = el("button", { class: "btn btn-pequeno rodape-btn-perigo" }, ["🗑 Excluir"]);
      btnExcluir.addEventListener("click", async () => {
        if (!confirm(`Excluir "${u.nome}"?`)) return;
        await fetch(`/api/configuracoes/usuarios/${u.id}`, { method: "DELETE" });
        carregar();
      });
      linha2.appendChild(btnExcluir);
    }
    card.appendChild(linha2);

    const areaEdicao = el("div", { style: "display:none;margin-top:10px;" });
    card.appendChild(areaEdicao);

    btnEditar.addEventListener("click", () => {
      if (areaEdicao.style.display === "none") {
        areaEdicao.style.display = "block";
        areaEdicao.innerHTML = "";
        const inNome = el("input", { type: "text", class: "icms-input", value: u.nome });
        const inEmail = el("input", { type: "text", class: "icms-input", value: u.email || "" });
        const inSenha = el("input", { type: "password", class: "icms-input", placeholder: "nova senha (opcional)" });
        const selSetor = el("select", { class: "icms-select" }, ["Fiscal", "Contabil", "todos"].map(s => el("option", { value: s, selected: s === u.setor ? "selected" : null }, [s])));
        const selPerfil = el("select", { class: "icms-select" }, ["usuario", "admin"].map(s => el("option", { value: s, selected: s === u.perfil ? "selected" : null }, [s])));
        const linhaE1 = el("div", { class: "icms-linha" }, [
          el("div", { class: "campo" }, [el("label", {}, ["Nome"]), inNome]),
          el("div", { class: "campo" }, [el("label", {}, ["Email"]), inEmail]),
        ]);
        const linhaE2 = el("div", { class: "icms-linha" }, [
          el("div", { class: "campo" }, [el("label", {}, ["Setor"]), selSetor]),
          el("div", { class: "campo" }, [el("label", {}, ["Perfil"]), selPerfil]),
          el("div", { class: "campo" }, [el("label", {}, ["Nova senha"]), inSenha]),
        ]);
        const btnSalvar = el("button", { class: "btn btn-primary btn-pequeno" }, ["✓ Salvar"]);
        btnSalvar.addEventListener("click", async () => {
          await fetch(`/api/configuracoes/usuarios/${u.id}`, {
            method: "PUT", headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              nome: inNome.value, setor: selSetor.value, perfil: selPerfil.value,
              email: inEmail.value, nova_senha: inSenha.value || null,
            }),
          });
          carregar();
        });
        areaEdicao.appendChild(linhaE1);
        areaEdicao.appendChild(linhaE2);
        areaEdicao.appendChild(btnSalvar);
      } else {
        areaEdicao.style.display = "none";
      }
    });

    areaLista.appendChild(card);
  }

  // Formulário de novo usuário
  container.appendChild(el("div", { class: "icms-secao" }, [el("h3", {}, ["Novo Usuário"])]));
  const inNomeN = el("input", { type: "text", class: "icms-input", placeholder: "Nome completo" });
  const inLoginN = el("input", { type: "text", class: "icms-input", placeholder: "login" });
  const inSenhaN = el("input", { type: "password", class: "icms-input", placeholder: "senha" });
  const inEmailN = el("input", { type: "text", class: "icms-input", placeholder: "email (opcional)" });
  const selSetorN = el("select", { class: "icms-select" }, ["Fiscal", "Contabil", "todos"].map(s => el("option", { value: s }, [s])));
  const selPerfilN = el("select", { class: "icms-select" }, ["usuario", "admin"].map(s => el("option", { value: s }, [s])));
  const areaErroN = el("div", { class: "erro" });

  container.appendChild(el("div", { class: "icms-linha" }, [
    el("div", { class: "campo" }, [el("label", {}, ["Nome completo"]), inNomeN]),
    el("div", { class: "campo" }, [el("label", {}, ["Login"]), inLoginN]),
    el("div", { class: "campo" }, [el("label", {}, ["Senha"]), inSenhaN]),
  ]));
  container.appendChild(el("div", { class: "icms-linha" }, [
    el("div", { class: "campo" }, [el("label", {}, ["Email"]), inEmailN]),
    el("div", { class: "campo" }, [el("label", {}, ["Setor"]), selSetorN]),
    el("div", { class: "campo" }, [el("label", {}, ["Perfil"]), selPerfilN]),
  ]));

  const btnCriar = el("button", { class: "btn btn-primary" }, ["Criar Usuário"]);
  btnCriar.addEventListener("click", async () => {
    areaErroN.className = "erro";
    const resp = await fetch("/api/configuracoes/usuarios", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        nome: inNomeN.value, login: inLoginN.value, senha: inSenhaN.value,
        setor: selSetorN.value, perfil: selPerfilN.value, email: inEmailN.value,
      }),
    });
    const dados = await resp.json();
    if (!resp.ok) {
      areaErroN.textContent = dados.detail || "Falha ao criar usuário.";
      areaErroN.className = "erro visivel";
      return;
    }
    inNomeN.value = ""; inLoginN.value = ""; inSenhaN.value = ""; inEmailN.value = "";
    carregar();
  });
  container.appendChild(btnCriar);
  container.appendChild(areaErroN);

  carregar();
}

// ==== ABA: Modelos de Tarefa ============================================
function renderAbaModelos(container) {
  container.appendChild(el("h3", {}, ["Modelos de Tarefa"]));

  const layout = el("div", { class: "cfg-empresas-layout" });
  const colEsq = el("div", { class: "cfg-empresas-lista" });
  const colDir = el("div", { style: "flex:1;min-width:0;" });
  layout.appendChild(colEsq);
  layout.appendChild(colDir);
  container.appendChild(layout);

  let modeloAtivo = null;

  async function carregarLista() {
    colEsq.innerHTML = "Carregando...";
    const resp = await fetch("/api/configuracoes/modelos");
    const dados = await resp.json();
    colEsq.innerHTML = "";
    dados.itens.forEach(m => {
      const item = el("div", { class: "cfg-empresa-item" + (modeloAtivo === m.id ? " ativa" : "") }, [
        el("strong", {}, [m.nome]),
        el("div", { class: "sub" }, [`[${m.setor}] [${m.escopo}]`]),
      ]);
      item.addEventListener("click", () => { modeloAtivo = m.id; carregarLista(); carregarSubtarefas(m.id, m.nome); });
      colEsq.appendChild(item);
    });
  }

  async function carregarSubtarefas(modeloId, nome) {
    colDir.innerHTML = "";
    colDir.appendChild(el("h3", {}, [`Subtarefas: ${nome}`]));
    const areaSubs = el("div", {});
    colDir.appendChild(areaSubs);

    async function render() {
      const resp = await fetch(`/api/configuracoes/modelos/${modeloId}/subtarefas`);
      const dados = await resp.json();
      areaSubs.innerHTML = "";
      if (!dados.itens.length) {
        areaSubs.appendChild(el("p", { class: "sub" }, ["Nenhuma subtarefa."]));
      }
      dados.itens.forEach(s => {
        const linha = el("div", { class: "cfg-obrigacao-linha" }, [
          el("span", {}, [`${s.ordem}. ${s.titulo}`]),
        ]);
        const btnUp = el("button", { class: "btn btn-pequeno" }, ["▲"]);
        btnUp.addEventListener("click", async () => { await fetch(`/api/configuracoes/subtarefas/${s.id}/mover/up`, { method: "POST" }); render(); });
        const btnDown = el("button", { class: "btn btn-pequeno" }, ["▼"]);
        btnDown.addEventListener("click", async () => { await fetch(`/api/configuracoes/subtarefas/${s.id}/mover/down`, { method: "POST" }); render(); });
        const btnDel = el("button", { class: "btn btn-pequeno rodape-btn-perigo" }, ["✖"]);
        btnDel.addEventListener("click", async () => { await fetch(`/api/configuracoes/subtarefas/${s.id}`, { method: "DELETE" }); render(); });
        linha.appendChild(btnUp); linha.appendChild(btnDown); linha.appendChild(btnDel);
        areaSubs.appendChild(linha);
      });
    }
    render();

    const inNova = el("input", { type: "text", class: "icms-input", placeholder: "Nova subtarefa..." });
    const btnAdd = el("button", { class: "btn btn-primary btn-pequeno" }, ["+ Adicionar"]);
    async function add() {
      if (!inNova.value.trim()) return;
      await fetch(`/api/configuracoes/modelos/${modeloId}/subtarefas`, {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ titulo: inNova.value }),
      });
      inNova.value = ""; render();
    }
    inNova.addEventListener("keydown", e => { if (e.key === "Enter") add(); });
    btnAdd.addEventListener("click", add);
    colDir.appendChild(el("div", { class: "icms-linha", style: "margin-top:10px;" }, [inNova, btnAdd]));
  }

  // Novo modelo
  container.appendChild(el("div", { class: "icms-secao" }, [el("h3", {}, ["Novo Modelo"])]));
  const inNomeM = el("input", { type: "text", class: "icms-input", placeholder: "Nome do modelo" });
  const selSetorM = el("select", { class: "icms-select" }, ["Fiscal", "Contabil"].map(s => el("option", { value: s }, [s])));
  const selEscopoM = el("select", { class: "icms-select" }, ["Por Filial", "Por Matriz"].map(s => el("option", { value: s }, [s])));
  const areaErroM = el("div", { class: "erro" });
  container.appendChild(el("div", { class: "icms-linha" }, [
    el("div", { class: "campo" }, [el("label", {}, ["Nome"]), inNomeM]),
    el("div", { class: "campo" }, [el("label", {}, ["Setor"]), selSetorM]),
    el("div", { class: "campo" }, [el("label", {}, ["Escopo"]), selEscopoM]),
  ]));
  const btnCriarM = el("button", { class: "btn btn-primary" }, ["+ Criar Modelo"]);
  btnCriarM.addEventListener("click", async () => {
    areaErroM.className = "erro";
    const resp = await fetch("/api/configuracoes/modelos", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ nome: inNomeM.value, setor: selSetorM.value, escopo: selEscopoM.value }),
    });
    const dados = await resp.json();
    if (!resp.ok) {
      areaErroM.textContent = dados.detail || "Falha ao criar modelo.";
      areaErroM.className = "erro visivel";
      return;
    }
    inNomeM.value = "";
    carregarLista();
  });
  container.appendChild(btnCriarM);
  container.appendChild(areaErroM);

  carregarLista();
}

// ==== ABA: Empresas ======================================================
function renderAbaEmpresas(container) {
  container.appendChild(el("h3", {}, ["Empresas"]));

  const layout = el("div", { class: "cfg-empresas-layout" });
  const colEsq = el("div", { class: "cfg-empresas-lista" });
  const colDir = el("div", { style: "flex:1;min-width:0;" });
  layout.appendChild(colEsq);
  layout.appendChild(colDir);
  container.appendChild(layout);

  let empresaAtiva = null;
  let listaCache = [];

  async function carregarLista(selecionarPrimeira) {
    colEsq.innerHTML = "Carregando...";
    const resp = await fetch("/api/configuracoes/empresas");
    const dados = await resp.json();
    listaCache = dados.itens;
    colEsq.innerHTML = "";

    const btnNova = el("button", { class: "btn btn-primary", style: "width:100%;margin-bottom:8px;" }, ["+ Nova Empresa"]);
    btnNova.addEventListener("click", () => { empresaAtiva = null; renderFormulario(null); });
    colEsq.appendChild(btnNova);

    const grupos = {};
    listaCache.forEach(e => { (grupos[e.grupo || "Outros"] = grupos[e.grupo || "Outros"] || []).push(e); });
    Object.keys(grupos).sort().forEach(grupo => {
      colEsq.appendChild(el("div", { class: "cfg-empresa-grupo-rotulo" }, [grupo.toUpperCase()]));
      grupos[grupo].forEach(e => {
        const item = el("div", { class: "cfg-empresa-item" + (empresaAtiva === e.id ? " ativa" : "") }, [e.nome]);
        item.addEventListener("click", () => { empresaAtiva = e.id; carregarLista(); renderFormulario(e.id); });
        colEsq.appendChild(item);
      });
    });

    if (selecionarPrimeira && listaCache.length && empresaAtiva === null) {
      empresaAtiva = listaCache[0].id;
      renderFormulario(empresaAtiva);
    }
  }

  async function renderFormulario(empresaId) {
    colDir.innerHTML = "";
    const isNovo = empresaId === null;
    colDir.appendChild(el("h3", {}, [isNovo ? "Nova Empresa" : "Editar Empresa"]));

    let empresa = { nome: "", cnpj: "", im: "", ie: "", grupo: "" };
    let param = { regime: "", atividade: "", municipio: "Rio de Janeiro", uf: "RJ" };
    let obrigacoesAtuais = {};

    if (!isNovo) {
      const resp = await fetch(`/api/configuracoes/empresas/${empresaId}`);
      const dados = await resp.json();
      empresa = dados.empresa; param = dados.param;
      dados.obrigacoes.forEach(o => { obrigacoesAtuais[o.obrigacao] = o; });
    }

    const inNome = el("input", { type: "text", class: "icms-input", value: empresa.nome || "" });
    const inCnpj = el("input", { type: "text", class: "icms-input", value: empresa.cnpj || "" });
    const inIm = el("input", { type: "text", class: "icms-input", value: empresa.im || "" });
    const inIe = el("input", { type: "text", class: "icms-input", value: empresa.ie || "" });
    const inGrupo = el("input", { type: "text", class: "icms-input", value: empresa.grupo || "" });

    colDir.appendChild(el("div", { class: "icms-linha" }, [
      el("div", { class: "campo" }, [el("label", {}, ["Nome"]), inNome]),
      el("div", { class: "campo" }, [el("label", {}, ["CNPJ"]), inCnpj]),
    ]));
    colDir.appendChild(el("div", { class: "icms-linha" }, [
      el("div", { class: "campo" }, [el("label", {}, ["IM"]), inIm]),
      el("div", { class: "campo" }, [el("label", {}, ["IE"]), inIe]),
      el("div", { class: "campo" }, [el("label", {}, ["Grupo"]), inGrupo]),
    ]));

    let selCopia = null;
    if (isNovo) {
      selCopia = el("select", { class: "icms-select" }, [
        el("option", { value: "" }, ["— nenhuma —"]),
        ...listaCache.map(e => el("option", { value: String(e.id) }, [e.nome])),
      ]);
      colDir.appendChild(el("div", { class: "campo" }, [el("label", {}, ["Copiar parametrização de"]), selCopia]));
    }

    colDir.appendChild(el("div", { class: "icms-secao" }, [el("h3", {}, ["Parametrização Fiscal"])]));
    const selRegime = el("select", { class: "icms-select" }, ["Lucro Real", "Lucro Presumido", "Simples Nacional"].map(r => el("option", { value: r, selected: r === param.regime ? "selected" : null }, [r])));
    const selAtividade = el("select", { class: "icms-select" }, ["Comércio", "Serviço", "Comércio + Serviço"].map(a => el("option", { value: a, selected: a === param.atividade ? "selected" : null }, [a])));
    const selMunicipio = el("select", { class: "icms-select" }, ["Rio de Janeiro", "Sao Joao de Meriti", "Barra Mansa"].map(m => el("option", { value: m, selected: m === param.municipio ? "selected" : null }, [m])));
    const inUf = el("input", { type: "text", class: "icms-input", value: param.uf || "RJ", style: "width:60px;" });

    colDir.appendChild(el("div", { class: "campo" }, [el("label", {}, ["Regime"]), selRegime]));
    colDir.appendChild(el("div", { class: "campo" }, [el("label", {}, ["Atividade"]), selAtividade]));
    colDir.appendChild(el("div", { class: "icms-linha" }, [
      el("div", { class: "campo" }, [el("label", {}, ["Município"]), selMunicipio]),
      el("div", { class: "campo" }, [el("label", {}, ["UF"]), inUf]),
    ]));

    colDir.appendChild(el("div", { class: "icms-secao" }, [el("h3", {}, ["Obrigações"])]));
    const varsObrigacoes = {}; // obrigacao -> {setor, checkbox, inputDia}

    let catalogo = {};
    try {
      const respCat = await fetch("/api/configuracoes/catalogo-obrigacoes");
      catalogo = await respCat.json();
    } catch (e) {}

    Object.keys(catalogo).forEach(setor => {
      const bloco = el("div", { class: "cfg-setor-bloco" });
      bloco.appendChild(el("div", { class: "cfg-setor-titulo" }, [setor.toUpperCase()]));
      catalogo[setor].forEach(item => {
        const existente = obrigacoesAtuais[item.obrigacao];
        const check = el("input", { type: "checkbox" });
        check.checked = !!(existente && existente.ativo);
        const inputDia = el("input", { type: "text", value: String((existente && existente.dia_venc) || item.dia_padrao) });
        const linha = el("div", { class: "cfg-obrigacao-linha" }, [
          check, el("span", { style: "width:180px;display:inline-block;" }, [item.obrigacao]),
          el("span", { class: "sub" }, ["Venc. dia:"]), inputDia,
        ]);
        bloco.appendChild(linha);
        varsObrigacoes[item.obrigacao] = { setor, check, inputDia, regraPadrao: item.regra_padrao };
      });
      colDir.appendChild(bloco);
    });

    const areaStatus = el("div", { class: "erro" });
    const btnSalvar = el("button", { class: "btn btn-primary" }, ["💾 Salvar"]);
    btnSalvar.addEventListener("click", async () => {
      areaStatus.className = "erro";
      if (!inNome.value.trim() || !inCnpj.value.trim()) {
        areaStatus.textContent = "Nome e CNPJ são obrigatórios.";
        areaStatus.className = "erro visivel";
        return;
      }
      btnSalvar.disabled = true;
      try {
        let eid = empresaId;
        const corpoEmpresa = { nome: inNome.value, cnpj: inCnpj.value, im: inIm.value, ie: inIe.value, grupo: inGrupo.value };
        if (isNovo) {
          if (selCopia && selCopia.value) corpoEmpresa.copiar_de = parseInt(selCopia.value, 10);
          const resp = await fetch("/api/configuracoes/empresas", {
            method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(corpoEmpresa),
          });
          const dados = await resp.json();
          if (!resp.ok) { areaStatus.textContent = dados.detail; areaStatus.className = "erro visivel"; return; }
          eid = dados.id;
        } else {
          await fetch(`/api/configuracoes/empresas/${eid}`, {
            method: "PUT", headers: { "Content-Type": "application/json" }, body: JSON.stringify(corpoEmpresa),
          });
        }

        const obrigacoesEnviar = Object.entries(varsObrigacoes)
          .filter(([, v]) => v.check.checked)
          .map(([nomeOb, v]) => ({
            setor: v.setor, obrigacao: nomeOb,
            dia_venc: parseInt(v.inputDia.value, 10) || null,
            regra_feriado: v.regraPadrao, ativo: true,
          }));

        const respParam = await fetch(`/api/configuracoes/empresas/${eid}/parametrizacao`, {
          method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            regime: selRegime.value, atividade: selAtividade.value,
            municipio: selMunicipio.value, uf: inUf.value, obrigacoes: obrigacoesEnviar,
          }),
        });
        const dadosParam = await respParam.json();
        areaStatus.textContent = "✅ " + (dadosParam.mensagem || "Salvo!");
        areaStatus.className = "erro visivel";
        areaStatus.style.color = "#2da478";
        areaStatus.style.background = "rgba(45,164,120,0.12)";
        areaStatus.style.borderColor = "rgba(45,164,120,0.4)";

        empresaAtiva = eid;
        carregarLista();
      } catch (e) {
        areaStatus.textContent = "Erro: " + e.message;
        areaStatus.className = "erro visivel";
      } finally {
        btnSalvar.disabled = false;
      }
    });
    colDir.appendChild(areaStatus);
    colDir.appendChild(btnSalvar);
  }

  carregarLista(true);
}

// ==== ABA: Modo (tema) ===================================================
const CHAVE_TEMA = "riozen_tema";

function temaAtual() {
  try { return localStorage.getItem(CHAVE_TEMA) === "claro" ? "claro" : "escuro"; }
  catch (e) { return "escuro"; }
}

function aplicarTema(nome) {
  if (nome === "claro") {
    document.documentElement.setAttribute("data-tema", "claro");
  } else {
    document.documentElement.removeAttribute("data-tema");
  }
  try { localStorage.setItem(CHAVE_TEMA, nome); } catch (e) {}
}

function renderAbaModo(container) {
  container.appendChild(el("h3", {}, ["Modo de Exibição"]));
  container.appendChild(el("p", { class: "sub" }, ["Escolha entre o tema escuro (padrão) e o tema claro."]));

  const TEMAS = [
    { id: "escuro", rotulo: "🌙 Escuro", desc: "Fundo azul-marinho (padrão Riozen)", bg: "#0f1923", sb: "#0a1219", cd: "#16232f" },
    { id: "claro", rotulo: "☀ Claro", desc: "Fundo branco e cinza (ambientes iluminados)", bg: "#f5f7fa", sb: "#e8edf3", cd: "#ffffff" },
  ];

  let selecionado = temaAtual();
  const cards = el("div", { class: "cfg-tema-cards" });

  function render() {
    cards.innerHTML = "";
    TEMAS.forEach(t => {
      const ativo = selecionado === t.id;
      const card = el("div", { class: "cfg-tema-card" + (ativo ? " ativo" : "") });
      const preview = el("div", { class: "cfg-tema-preview", style: `background:${t.bg};` }, [
        el("div", { class: "lado", style: `background:${t.sb};` }),
        el("div", { class: "corpo" }, [
          el("div", { class: "linha", style: `background:${t.cd};width:80%;` }),
          el("div", { class: "linha", style: `background:${t.cd};width:60%;` }),
        ]),
      ]);
      card.appendChild(preview);
      if (ativo) card.appendChild(el("div", { class: "sub", style: "color:#2da478;font-weight:600;margin-bottom:4px;" }, ["✔ Ativo"]));
      card.appendChild(el("div", { style: "font-weight:600;" }, [t.rotulo]));
      card.appendChild(el("div", { class: "sub" }, [t.desc]));
      card.addEventListener("click", () => { selecionado = t.id; render(); });
      cards.appendChild(card);
    });
  }
  render();
  container.appendChild(cards);

  const btnAplicar = el("button", { class: "btn btn-primary", style: "margin-top:20px;" }, ["Aplicar Tema"]);
  btnAplicar.addEventListener("click", () => aplicarTema(selecionado));
  container.appendChild(btnAplicar);
}

const CNPJ_FILIAIS_NFSE = {
  "Toyota|PILARES": "22.134.988/0001-14", "Toyota|TIJUCA": "22.134.988/0002-03",
  "Toyota|CAMPO GRANDE": "22.134.988/0003-86", "Toyota|BARRA - JARDIM OCEANICO": "22.134.988/0004-67",
  "Toyota|JACAREPAGUA WP": "22.134.988/0005-48", "Toyota|LEXUS": "22.134.988/0006-29",
  "Toyota|ALVORADA": "22.134.988/0007-00", "Toyota|RECREIO": "22.134.988/0008-90",
  "BYD|JACAREPAGUA": "52.752.754/0001-00", "BYD|CAMPO GRANDE": "52.752.754/0002-82",
  "BYD|SAO JOAO DE MERITI": "52.752.754/0003-63", "BYD|BARRA MANSA": "52.752.754/0004-44",
  "Riozen|INTERMEDIACAO": "58.489.102/0001-00",
};

function _formatarDataBR(d) {
  return `${String(d.getDate()).padStart(2,"0")}/${String(d.getMonth()+1).padStart(2,"0")}/${d.getFullYear()}`;
}

function _telaNfseBase(voltarFn, cfg) {
  // cfg = { titulo, subtitulo, endpoint, botoesArquivo: [{tipo, rotulo}], renderExtras(dados) }
  const conteudo = document.getElementById("conteudo");
  conteudo.innerHTML = "";
  renderAcoesNav(voltarFn);
  conteudo.appendChild(el("div", { class: "titulo-tela" }, [
    el("h2", {}, [cfg.titulo]),
    el("p", {}, [cfg.subtitulo]),
  ]));

  const wrap = el("div", { class: "icms-wrap" });
  let filiaisCache = null;
  let empresaAtual = "Toyota";
  let filialAtual = null;

  const areaEmpresa = el("div", { class: "icms-linha" });
  const areaFiliais = el("div", {});
  const spanCnpj = el("span", { style: "color:var(--accent-text);font-weight:600;" }, ["—"]);

  function montarEmpresas() {
    areaEmpresa.innerHTML = "";
    Object.keys(filiaisCache).forEach(emp => {
      const id = "nfse-emp-" + emp;
      const radio = el("input", { type: "radio", name: "nfse-empresa", id, checked: emp === empresaAtual ? "checked" : null });
      radio.addEventListener("change", () => { empresaAtual = emp; filialAtual = null; montarFiliais(); });
      areaEmpresa.appendChild(el("label", { style: "display:flex;align-items:center;gap:6px;margin-right:16px;" }, [radio, emp]));
    });
  }

  function montarFiliais() {
    areaFiliais.innerHTML = "";
    const grid = el("div", { style: "display:grid;grid-template-columns:1fr 1fr;gap:6px 24px;" });
    (filiaisCache[empresaAtual] || []).forEach((fil, idx) => {
      if (filialAtual === null && idx === 0) filialAtual = fil;
      const id = "nfse-fil-" + fil.replace(/\s+/g, "-");
      const radio = el("input", { type: "radio", name: "nfse-filial", id, checked: fil === filialAtual ? "checked" : null });
      const cnpj = CNPJ_FILIAIS_NFSE[`${empresaAtual}|${fil}`] || "";
      radio.addEventListener("change", () => { filialAtual = fil; spanCnpj.textContent = cnpj; });
      grid.appendChild(el("label", { style: "display:flex;align-items:center;gap:6px;" }, [radio, `${fil}${cnpj ? " (" + cnpj + ")" : ""}`]));
    });
    areaFiliais.appendChild(grid);
    spanCnpj.textContent = CNPJ_FILIAIS_NFSE[`${empresaAtual}|${filialAtual}`] || "—";
  }

  const hoje = new Date();
  const inicioMes = new Date(hoje.getFullYear(), hoje.getMonth(), 1);
  const inputDataIni = el("input", { type: "text", class: "icms-input", value: _formatarDataBR(inicioMes) });
  const inputDataFim = el("input", { type: "text", class: "icms-input", value: _formatarDataBR(hoje) });
  const chkReprocessar = el("input", { type: "checkbox" });

  const btnConsultar = el("button", { class: "btn btn-primary" }, ["🔍 Consultar API NFS-e"]);
  const areaBotoesArquivo = el("div", { class: "icms-linha", style: "margin-top:10px;" });
  const areaErro = el("div", { class: "erro" });
  const areaLog = el("pre", { class: "icms-log" }, ["Pronto. Selecione a empresa, filial e período, depois clique em Consultar."]);
  const areaResumo = el("div", {});

  let ultimoToken = null;

  function montarBotoesArquivo(arquivosDisponiveis) {
    areaBotoesArquivo.innerHTML = "";
    cfg.botoesArquivo.forEach(b => {
      const disponivel = ultimoToken && arquivosDisponiveis && arquivosDisponiveis.includes(b.tipo);
      const btn = el("button", { class: "btn" + (disponivel ? "" : "") }, [b.rotulo]);
      if (!disponivel) {
        btn.disabled = true;
      } else {
        btn.addEventListener("click", () => {
          window.open(`/api/nfse/download/${ultimoToken}/${b.tipo}`, "_blank");
        });
      }
      areaBotoesArquivo.appendChild(btn);
    });
  }
  montarBotoesArquivo([]);

  btnConsultar.addEventListener("click", async () => {
    if (!filialAtual) return;
    areaErro.className = "erro";
    areaResumo.innerHTML = "";
    btnConsultar.disabled = true;
    btnConsultar.textContent = "Consultando...";
    areaLog.textContent = "Consultando a API oficial (ADN Contribuinte)... isso pode levar alguns minutos, dependendo do volume de notas.";

    try {
      const fd = new FormData();
      fd.append("empresa", empresaAtual);
      fd.append("filial", filialAtual);
      fd.append("data_inicio", inputDataIni.value);
      fd.append("data_fim", inputDataFim.value);
      fd.append("ambiente", "producao");
      fd.append("ignorar_checkpoint", chkReprocessar.checked ? "true" : "false");

      const resp = await fetch(cfg.endpoint, { method: "POST", body: fd });
      const dados = await resp.json();
      areaLog.textContent = (dados.logs || []).join("\n") || "(sem log)";

      if (!resp.ok || !dados.ok) {
        areaErro.textContent = dados.mensagem || dados.detail || "Falha na consulta.";
        areaErro.className = "erro visivel";
        ultimoToken = null;
        montarBotoesArquivo([]);
        return;
      }

      ultimoToken = dados.token;
      montarBotoesArquivo(dados.arquivos_disponiveis || []);

      areaResumo.appendChild(el("div", { class: "icms-nota ok" }, [
        `✅ ${dados.mensagem || "Consulta concluída."} (${dados.total_notas ?? 0} nota(s), ${dados.notas_divergentes ?? 0} com divergência)`,
      ]));
      if (cfg.renderExtras) cfg.renderExtras(areaResumo, dados);
    } catch (e) {
      areaErro.textContent = "Falha ao consultar: " + e.message;
      areaErro.className = "erro visivel";
    } finally {
      btnConsultar.disabled = false;
      btnConsultar.textContent = "🔍 Consultar API NFS-e";
    }
  });

  wrap.appendChild(el("div", { class: "campo" }, [el("label", {}, ["EMPRESA"]), areaEmpresa]));
  wrap.appendChild(el("div", { class: "campo" }, [el("label", {}, ["FILIAL"]), areaFiliais]));
  wrap.appendChild(el("div", { class: "icms-linha", style: "margin-top:6px;" }, [
    el("span", { class: "sub" }, ["CNPJ: "]), spanCnpj,
  ]));
  wrap.appendChild(el("div", { class: "icms-linha", style: "margin-top:10px;" }, [
    el("div", { class: "campo" }, [el("label", {}, ["Data inicial"]), inputDataIni]),
    el("div", { class: "campo" }, [el("label", {}, ["Data final"]), inputDataFim]),
  ]));
  wrap.appendChild(el("p", { class: "sub", style: "margin-top:10px;" }, [
    "🔒 Consulta via API oficial (ADN Contribuinte / SERPRO), autenticada por certificado .pfx configurado em certificados/senhas.json. Sem navegador e sem CAPTCHA — não é necessária nenhuma ação manual durante a consulta.",
  ]));
  wrap.appendChild(el("label", { style: "display:flex;align-items:center;gap:6px;margin-top:8px;" }, [
    chkReprocessar, "Reprocessar desde o início (ignorar checkpoint de NSU) — use se o período já foi consultado antes e o NSU já passou dele",
  ]));
  wrap.appendChild(el("div", { class: "icms-linha", style: "margin-top:14px;" }, [btnConsultar]));
  wrap.appendChild(areaBotoesArquivo);
  wrap.appendChild(areaErro);
  wrap.appendChild(areaResumo);
  wrap.appendChild(el("div", { class: "icms-rotulo-log" }, ["Log de execução"]));
  wrap.appendChild(areaLog);
  conteudo.appendChild(wrap);

  fetch("/api/nfse/filiais").then(async r => {
    if (!r.ok) {
      const erro = await r.json().catch(() => ({}));
      throw new Error(erro.detail || `Falha ao carregar filiais (HTTP ${r.status})`);
    }
    return r.json();
  }).then(dados => {
    filiaisCache = dados;
    montarEmpresas();
    montarFiliais();
  }).catch((e) => {
    areaErro.textContent = e.message || "Não foi possível carregar a lista de filiais.";
    areaErro.className = "erro visivel";
  });
}

function telaHome() {
  marcarNavAtiva(null);
  renderBreadcrumb([{ rotulo: "Inicio" }]);
  const opcoes = [];
  if (podeVerGrupo("fiscal")) {
    opcoes.push({ rotulo: "Fiscal", rotuloTag: SETOR_ICONE.fiscal, desc: "Apuracao, impostos e obrigacoes fiscais.", onClick: () => telaGrade("fiscal") });
  }
  if (podeVerGrupo("contabil")) {
    opcoes.push({ rotulo: "Contabil", rotuloTag: SETOR_ICONE.contabil, desc: "Folha de pagamento e modulos contabeis.", onClick: () => telaGrade("contabil") });
  }
  opcoes.push({ rotulo: "Geral", rotuloTag: SETOR_ICONE.geral, desc: "Clientes, fornecedores, Reforma Tributaria e NCM/cClassTrib.", onClick: () => telaGrade("geral") });
  renderGradeSetores("Selecione o setor", "Escolha o setor para continuar.", opcoes, null);
}

function telaGrade(idGrupo) {
  const grupo = ARVORE_NAV.find(g => g.grupo === idGrupo);
  marcarNavAtiva(null);
  const rotuloGrupo = grupo.rotulo.charAt(0) + grupo.rotulo.slice(1).toLowerCase();
  renderBreadcrumb([{ rotulo: "Inicio", onClick: telaHome }, { rotulo: rotuloGrupo }]);

  if (grupo.expandirSubgrupos) {
    const opcoes = grupo.subgrupos.map(sg => ({
      rotulo: sg.titulo === "Analise Fiscal" ? "Analise Fiscal" : sg.titulo,
      rotuloTag: sg.rotuloTag || "",
      desc: sg.desc || "",
      onClick: () => telaSubgrupo(idGrupo, sg.titulo),
    }));
    renderGradeSetores(rotuloGrupo, "Selecione o modulo desejado.", opcoes, telaHome);
    return;
  }

  const itens = [];
  grupo.subgrupos.forEach(sg => {
    sg.itens.forEach(item => {
      itens.push({ rotulo: item.rotulo, rotuloTag: "", desc: sg.titulo,
        onClick: item.link ? () => window.open(item.link(USUARIO), "_blank") : () => telaModulo(item) });
    });
  });
  renderGradeSetores(rotuloGrupo, "Selecione o modulo desejado.", itens, telaHome);
}

function telaSubgrupo(idGrupo, tituloSubgrupo) {
  const grupo = ARVORE_NAV.find(g => g.grupo === idGrupo);
  const sg = grupo.subgrupos.find(s => s.titulo === tituloSubgrupo);
  marcarNavAtiva(null);
  const rotuloGrupo = grupo.rotulo.charAt(0) + grupo.rotulo.slice(1).toLowerCase();
  renderBreadcrumb([
    { rotulo: "Inicio", onClick: telaHome },
    { rotulo: rotuloGrupo, onClick: () => telaGrade(idGrupo) },
    { rotulo: tituloSubgrupo },
  ]);

  const itens = sg.itens.map(item => ({
    rotulo: item.rotulo, rotuloTag: "", desc: item.desc || "",
    onClick: item.link ? () => window.open(item.link(USUARIO), "_blank") : () => telaModulo(item),
  }));
  if (sg.maisEmBreve) {
    itens.push({ rotulo: "Em breve...", rotuloTag: "⚙", desc: "", onClick: null });
  }
  renderGradeSetores(tituloSubgrupo, "Selecione o tipo de analise.", itens, () => telaGrade(idGrupo));
}

// ---------------------------------------------------------------------
const ROTULO_PERFIL = { admin: "ADMIN", fiscal: "FISCAL", contabil: "CONTABIL" };

async function iniciar() {
  try {
    const resp = await fetch("/api/me");
    if (!resp.ok) {
      window.location.href = "/login";
      return;
    }
    USUARIO = await resp.json();
  } catch (e) {
    window.location.href = "/login";
    return;
  }

  document.getElementById("usuario-nome").textContent = USUARIO.nome;
  const badge = document.getElementById("badge-perfil");
  badge.textContent = ROTULO_PERFIL[USUARIO.perfil_acesso] || USUARIO.perfil_acesso.toUpperCase();
  badge.classList.add(USUARIO.perfil_acesso);

  renderSidebar();
  document.getElementById("tela-carregando").style.display = "none";
  document.getElementById("conteudo").style.display = "block";
  telaHome();
}

document.getElementById("btn-sair").addEventListener("click", async () => {
  await fetch("/api/logout", { method: "POST" });
  window.location.href = "/login";
});

iniciar();
